[package]
name = "flick"
version = "0.2.0"
edition = "2021"
description = "2D grid navigation on top of Windows 11 virtual desktops"
license = "MIT"
repository = "https://github.com/philaxis/flick"
homepage = "https://philaxis.github.io/flick/"
build = "build.rs"

# The exe is named after the app; keep in step with APP_NAME in src/config.rs.
[[bin]]
name = "Flick"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
# 0.0.46 targets Windows 11 23H2 (22631.3085+). 0.0.49 requires 24H2.
# Vendored (see [patch]) to expose move_desktop, which upstream keeps private.
winvd = "=0.0.46"
windows = { version = "0.52", features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[patch.crates-io]
winvd = { path = "vendor/winvd" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
