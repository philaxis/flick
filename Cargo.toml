[package]
name = "flick"
version = "0.5.0"
edition = "2021"
description = "2D grid navigation on top of Windows 11 virtual desktops"
license = "MIT"
repository = "https://github.com/philaxis/flick"
homepage = "https://philaxis.github.io/flick/"
build = "build.rs"

# The exe is named after the app; keep in step with APP_NAME in src/config.rs.
[[bin]]
name = "Flick"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
# The shell's virtual desktop interfaces are undocumented and their layout
# changed in 24H2, so each winvd release fits one range of Windows builds:
# 0.0.46 fits 22621.3155+ / 22631.3085+ (23H2), 0.0.49 fits 26100.2605+
# (24H2, 25H2). Both are linked in and src/vdapi.rs picks one at start-up.
# Vendored to expose move_desktop, which upstream keeps private.
winvd_23h2 = { package = "winvd", path = "vendor/winvd" }
winvd_24h2 = { package = "winvd", path = "vendor/winvd-24h2" }
windows = { version = "0.52", features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
