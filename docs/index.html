<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flick — 윈도우 11 가상 데스크톱을 2D 격자로</title>
<meta name="description" content="버튼을 누른 채 마우스를 밀면 옆 데스크톱으로 넘어갑니다. 윈도우 11 가상 데스크톱을 2D 격자로 쓰는 무료 오픈 소스 프로그램. Hold a button, flick the mouse, land on the next desktop. Free and open source for Windows 11.">
<link rel="canonical" href="https://philaxis.github.io/flick/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Flick">
<meta property="og:title" content="Flick — 누르고, 밀면, 옆 데스크톱.">
<meta property="og:description" content="윈도우 11 가상 데스크톱을 2D 격자로. 무료, 오픈 소스. / Hold. Flick. Next desktop. Windows 11 virtual desktops as a 2D grid.">
<meta property="og:url" content="https://philaxis.github.io/flick/">
<meta property="og:locale" content="ko_KR">
<meta property="og:locale:alternate" content="en_US">
<meta property="og:image" content="https://philaxis.github.io/flick/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#f3f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08090b" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column as wide as the screen-shaped stage; the line and the download sit on its top edge, everything else hangs below it. */
:root{
  --bg:#f3f4f7; --ink:#12141a; --mute:#646a78; --line:rgba(18,20,26,.14);
  --accent:#579eff; --accent-ink:#2a6fe6; --on-accent:#06101f;
  --stage-shadow:0 44px 90px -38px rgba(22,34,66,.55), 0 0 0 1px rgba(18,20,26,.22);
  --font:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --gut:20px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#08090b; --ink:#eef0f4; --mute:#8b919d; --line:rgba(255,255,255,.14);
    --accent-ink:#579eff;
    --stage-shadow:0 0 0 1px rgba(255,255,255,.12);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--font);padding-inline:var(--gut);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:3px;border-radius:6px}
.col{width:min(1240px,100%,max(600px,(100svh - 292px)*16/9));margin-inline:auto}

.top{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand img{width:28px;height:28px;display:block}
.top nav{display:flex;align-items:center;gap:22px;font-size:14px;font-weight:500;color:var(--mute)}
.top nav a:hover,.top nav button:hover{color:var(--ink)}
.top nav button{font:inherit;color:inherit;background:none;border:0;padding:6px 0;cursor:pointer}

.say{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;padding-block:10px 30px}
h1{margin:0;font-weight:700;letter-spacing:-.035em;line-height:1.04;font-size:clamp(34px,5.6vw,76px);text-wrap:balance}
:lang(en) h1{font-size:clamp(34px,4.7vw,64px);letter-spacing:-.04em}
h1 span{transition:color .5s ease}
h1 span.on{color:var(--accent-ink);transition-duration:.08s}
.get{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding-bottom:6px}
.dl{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 22px 0 18px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:17px;white-space:nowrap;transition:transform .15s ease,filter .15s ease}
.dl:hover{filter:brightness(1.08);transform:translateY(-1px)}
.dl:active{transform:translateY(0)}
.dl svg{width:18px;height:18px;flex:none}
.dl small{font-size:13px;font-weight:500;opacity:.62;margin-left:2px}
.fine{margin:0;font-size:13px;line-height:1.5;color:var(--mute)}

.stage{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#17212e;box-shadow:var(--stage-shadow);touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.stage:active{cursor:grabbing}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.under{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding-top:14px;color:var(--mute);font-size:15px}
.sub{position:relative;flex:1;min-width:0;height:22px}
.sub span{position:absolute;left:0;top:0;white-space:nowrap;opacity:0;transform:translateY(4px);transition:opacity .35s ease,transform .35s ease}
.sub[data-phase="flick"] .a,.sub[data-phase="board"] .b{opacity:1;transform:none}
.keys{display:grid;grid-template-columns:repeat(3,22px);grid-template-rows:repeat(2,22px);gap:3px;flex:none}
.keys i{display:grid;place-items:center;border:1px solid var(--line);border-radius:5px;font-style:normal;font-size:11px;line-height:1;transition:background .4s ease,color .4s ease,border-color .4s ease}
.keys i.on{background:var(--accent);color:var(--on-accent);border-color:transparent;transition-duration:.05s}
.keys .u{grid-column:2}.keys .l{grid-column:1;grid-row:2}.keys .d{grid-column:2;grid-row:2}.keys .r{grid-column:3;grid-row:2}

.beats{display:grid;grid-template-columns:1fr 1fr;gap:56px;margin-top:clamp(72px,11vw,150px)}
.beats figure{margin:0;min-width:0}
.beats canvas{display:block;width:100%;height:230px;color:var(--ink)}
.beats figcaption{margin-top:22px;font-size:clamp(21px,2.3vw,30px);font-weight:600;letter-spacing:-.025em;line-height:1.2}

.end{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:clamp(80px,12vw,170px);padding-top:34px;border-top:1px solid var(--line)}
.end .brand{font-size:clamp(34px,5vw,64px);gap:18px;letter-spacing:-.035em}
.end .brand img{width:clamp(44px,5.4vw,70px);height:auto}
footer{display:flex;gap:8px;padding-block:44px 40px;font-size:13px;color:var(--mute)}
footer a{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
footer a:hover{color:var(--ink)}

@media (max-width:820px){
  .say{flex-direction:column;align-items:flex-start;gap:22px;padding-bottom:26px}
  h1,:lang(en) h1{font-size:clamp(34px,10.4vw,60px)}
  .beats{grid-template-columns:1fr;gap:64px}
  .beats canvas{height:200px}
}
@media (max-width:640px){
  :root{--gut:16px}
  .col{width:100%}
  .top{height:58px}
  .stage{aspect-ratio:5/4;border-radius:12px}
  .under{font-size:13.5px}
  .end{flex-direction:column;align-items:flex-start}
  .keys{display:none}
}
@media (hover:none){.keys{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="col">
  <header class="top">
    <a class="brand" href="https://philaxis.github.io/flick/"><img src="icon.png" alt="" width="28" height="28">Flick</a>
    <nav>
      <button type="button" id="lang" data-ko="English" data-en="한국어" data-ko-label="Switch to English" data-en-label="한국어로 보기">English</button>
      <a href="https://github.com/philaxis/flick">GitHub</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="say">
        <h1 id="line"><span data-ko="누르고," data-en="Hold.">누르고,</span> <span data-ko="밀면," data-en="Flick.">밀면,</span> <span data-ko="옆 데스크톱." data-en="Next desktop.">옆 데스크톱.</span></h1>
        <div class="get">
          <a class="dl" href="https://github.com/philaxis/flick/releases/latest/download/Flick.exe">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5v9M5 8l4 4 4-4M3 15.5h12"/></svg>
            <span data-ko="다운로드" data-en="Download">다운로드</span><small>0.7 MB</small>
          </a>
          <p class="fine"><span data-ko="윈도우 11 23H2 · 무료 · 오픈 소스" data-en="Windows 11 23H2 · free · open source">윈도우 11 23H2 · 무료 · 오픈 소스</span><br><span data-ko="24H2는 아직 지원하지 않습니다" data-en="24H2 not supported yet">24H2는 아직 지원하지 않습니다</span></p>
        </div>
      </div>

      <div class="stage" id="stage" tabindex="0" role="img"
           data-ko-label="Flick 사용 화면: 마우스 옆 버튼을 누른 채 밀면 옆 데스크톱으로 넘어가고, 한 번 누르면 모든 창이 보입니다. 방향키로 직접 움직일 수 있습니다."
           data-en-label="Flick in use: hold the mouse side button and flick to land on the next desktop; tap it to see every window. Arrow keys move you around."
           aria-label="Flick 사용 화면">
        <canvas id="hero"></canvas>
      </div>
      <div class="under">
        <div class="sub" id="sub" data-phase="flick">
          <span class="a" data-ko="누른 채로 밀기" data-en="Hold and flick">누른 채로 밀기</span>
          <span class="b" data-ko="톡 누르면 전부 보기 · 끌어서 옮기기" data-en="Tap to see everything · drag to move">톡 누르면 전부 보기 · 끌어서 옮기기</span>
        </div>
        <div class="keys" id="keys" aria-hidden="true"><i class="u">↑</i><i class="l">←</i><i class="d">↓</i><i class="r">→</i></div>
      </div>
    </section>

    <section class="beats">
      <figure>
        <canvas id="beat1" aria-hidden="true"></canvas>
        <figcaption data-ko="행은 작업, 칸은 화면." data-en="Rows are jobs. Cells are screens.">행은 작업, 칸은 화면.</figcaption>
      </figure>
      <figure>
        <canvas id="beat2" aria-hidden="true"></canvas>
        <figcaption data-ko="위아래는 떠났던 칸으로." data-en="Each row remembers your place.">위아래는 떠났던 칸으로.</figcaption>
      </figure>
    </section>

    <section class="end">
      <div class="brand"><img src="icon.png" alt="" width="70" height="70">Flick</div>
      <a class="dl" href="https://github.com/philaxis/flick/releases/latest/download/Flick.exe">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5v9M5 8l4 4 4-4M3 15.5h12"/></svg>
        <span data-ko="다운로드" data-en="Download">다운로드</span><small>0.7 MB</small>
      </a>
    </section>
  </main>

  <footer>
    <span>MIT</span><span>·</span>
    <a href="https://github.com/philaxis/flick" data-ko="소스" data-en="source">소스</a><span>·</span>
    <span>made by <a href="https://philaxis.github.io">philaxis</a></span>
  </footer>
</div>

<script>
(() => {
'use strict';
const ACCENT = '#579eff';
const FONT = '"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif';
const MONO = 'ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace';
const qs = new URLSearchParams(location.search);
const FREEZE = qs.has('t') ? parseFloat(qs.get('t')) : null;   // ?t=3.6 holds one frame of the loop
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const STILL = FREEZE !== null || REDUCED;

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const inOut = t => (t = clamp(t, 0, 1), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const follow = (cur, to, dt, tau) => to + (cur - to) * Math.exp(-dt / tau);
const white = a => `rgba(255,255,255,${a})`;
const accent = a => `rgba(87,158,255,${a})`;

/* ---------- language ---------- */
let lang = 'ko';
try { lang = localStorage.getItem('flick-lang') || ''; } catch (e) { lang = ''; }
if (qs.get('lang')) lang = qs.get('lang');
if (lang !== 'ko' && lang !== 'en') lang = (navigator.languages || [navigator.language || 'ko']).some(l => /^ko/i.test(l)) ? 'ko' : 'en';
const tr = v => (v && typeof v === 'object') ? v[lang] : v;
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-ko]').forEach(el => { el.textContent = el.dataset[lang]; });
  document.querySelectorAll('[data-ko-label]').forEach(el => { el.setAttribute('aria-label', el.dataset[lang + 'Label']); });
}

/* ---------- drawing helpers ---------- */
function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function bar(g, x, y, w, h, c, r) { g.fillStyle = c; if (r) { rr(g, x, y, w, h, r); g.fill(); } else g.fillRect(x, y, w, h); }
function txt(g, s, x, y, px, c, weight, align, font) {
  g.font = `${weight || 400} ${px}px ${font || FONT}`; g.fillStyle = c; g.textAlign = align || 'left'; g.textBaseline = 'middle'; g.fillText(s, x, y);
}
function fitText(g, s, max) {
  if (g.measureText(s).width <= max) return s;
  while (s.length > 1 && g.measureText(s + '…').width > max) s = s.slice(0, -1);
  return s + '…';
}
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function line(g, pts, c, lw) { g.strokeStyle = c; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); }

/* ---------- the apps on the demo desktops ---------- */
const APPS = {
  code:    { name: 'Visual Studio Code', color: '#2d8fe0', bar: '#181a21', fg: '#c9cfdb' },
  chrome:  { name: 'Google Chrome', color: '#f2b63a', tabs: true, fg: '#3c4048' },
  term:    { name: { ko: 'Windows 터미널', en: 'Windows Terminal' }, color: '#2a2d37', bar: '#1b1d24', fg: '#c9cfdb' },
  figma:   { name: 'Figma', color: '#9d6bff', bar: '#26272c', fg: '#d5d8e0' },
  slack:   { name: 'Slack', color: '#7a3b86', bar: '#2c1830', fg: '#e3d6e6' },
  spotify: { name: 'Spotify', color: '#22c55e', bar: '#0a0b0d', fg: '#c9cfdb' },
  mail:    { name: { ko: '메일', en: 'Mail' }, color: '#2aa6c9', bar: '#eceef2', fg: '#3c4048' },
  notepad: { name: { ko: '메모장', en: 'Notepad' }, color: '#8fa9c4', bar: '#f1f2f5', fg: '#3c4048' },
  excel:   { name: 'Excel', color: '#1f7a45', bar: '#1f7a45', fg: '#eaf5ee' },
};
const TASKBAR = ['code', 'chrome', 'term', 'figma', 'excel', 'slack', 'spotify', 'mail'];
const ICON_IMG = new Image();

function drawIcon(g, app, x, y, s) {
  const c = APPS[app].color, m = x + s / 2, n = y + s / 2;
  if (app === 'chrome' || app === 'spotify') { g.fillStyle = c; g.beginPath(); g.arc(m, n, s / 2, 0, 7); g.fill(); }
  else bar(g, x, y, s, s, c, s * .24);
  const w = '#fff', lw = Math.max(.8, s * .09);
  if (app === 'code') { line(g, [[x + s * .4, y + s * .3], [x + s * .22, n], [x + s * .4, y + s * .7]], w, lw); line(g, [[x + s * .6, y + s * .3], [x + s * .78, n], [x + s * .6, y + s * .7]], w, lw); }
  else if (app === 'chrome') { g.fillStyle = w; g.beginPath(); g.arc(m, n, s * .27, 0, 7); g.fill(); g.fillStyle = '#3d7bf0'; g.beginPath(); g.arc(m, n, s * .17, 0, 7); g.fill(); }
  else if (app === 'term') { line(g, [[x + s * .24, y + s * .32], [x + s * .44, n], [x + s * .24, y + s * .68]], w, lw); line(g, [[x + s * .52, y + s * .7], [x + s * .78, y + s * .7]], w, lw); }
  else if (app === 'figma') { g.fillStyle = w; g.beginPath(); g.arc(x + s * .4, y + s * .4, s * .17, 0, 7); g.fill(); bar(g, x + s * .46, y + s * .46, s * .3, s * .3, 'rgba(255,255,255,.75)', s * .06); }
  else if (app === 'slack') { [[.4, .24, .32, .76], [.66, .24, .58, .76], [.22, .4, .78, .4], [.2, .62, .76, .62]].forEach(p => line(g, [[x + s * p[0], y + s * p[1]], [x + s * p[2], y + s * p[3]]], w, lw)); }
  else if (app === 'spotify') { g.strokeStyle = '#0b1a10'; g.lineWidth = lw; g.lineCap = 'round'; [.36, .52, .68].forEach((k, i) => { g.beginPath(); g.arc(m, y + s * (k + .62), s * .7 - i * s * .04, -2.02 + i * .05, -1.12 - i * .05); g.stroke(); }); }
  else if (app === 'mail') { g.strokeStyle = w; g.lineWidth = lw; g.strokeRect(x + s * .22, y + s * .3, s * .56, s * .4); line(g, [[x + s * .22, y + s * .32], [m, y + s * .54], [x + s * .78, y + s * .32]], w, lw); }
  else if (app === 'notepad') { [.34, .5, .66].forEach(k => line(g, [[x + s * .26, y + s * k], [x + s * (k === .66 ? .58 : .74), y + s * k]], '#26364a', lw)); }
  else if (app === 'excel') { line(g, [[x + s * .3, y + s * .28], [x + s * .7, y + s * .72]], w, lw * 1.15); line(g, [[x + s * .7, y + s * .28], [x + s * .3, y + s * .72]], w, lw * 1.15); }
}

/* Window bodies. Drawn once per window into a sprite; the board reuses them as previews. */
const PAINT = {
  code(g, x, y, w, h, u, win, R) {
    bar(g, x, y, w, h, '#1c1e26');
    let sx = x;
    if (w > 330 * u) {
      bar(g, x, y, 36 * u, h, '#15171c');
      for (let i = 0; i < 4; i++) bar(g, x + 11 * u, y + (14 + i * 27) * u, 14 * u, 14 * u, i ? '#353945' : '#8a93a6', 3 * u);
      bar(g, x + 36 * u, y, 130 * u, h, '#181a21');
      for (let i = 0; i < 10; i++) {
        if (i === 3) bar(g, x + 36 * u, y + (8 + i * 17) * u, 130 * u, 17 * u, '#262b39');
        bar(g, x + (50 + (i % 4 ? 10 : 0)) * u, y + (14 + i * 17) * u, (38 + R() * 52) * u, 6 * u, i === 3 ? '#c3cad9' : '#3b404d', 3 * u);
      }
      sx = x + 166 * u;
    }
    bar(g, sx, y, w - (sx - x), 27 * u, '#15171c'); bar(g, sx, y, 112 * u, 27 * u, '#1c1e26');
    bar(g, sx + 12 * u, y + 10.5 * u, 64 * u, 6 * u, '#c3cad9', 3 * u); bar(g, sx + 126 * u, y + 10.5 * u, 52 * u, 6 * u, '#4a5060', 3 * u);
    const cols = ['#c792ea', '#82aaff', '#c3e88d', '#f78c6c', '#9aa3b5', '#ffcb6b'], ind = [0, 1, 2, 2, 1, 2, 3, 3, 2, 1, 0, 0, 1, 2, 2, 1];
    for (let n = 0, ly = y + 42 * u; ly < y + h - 8 * u; n++, ly += 14.5 * u) {
      bar(g, sx + 10 * u, ly, 9 * u, 5 * u, '#353945', 2 * u);
      if (n % 7 === 6) continue;
      let lx = sx + (34 + ind[n % 16] * 16) * u;
      for (let j = 0, k = 1 + Math.floor(R() * 4); j < k; j++) {
        const len = (14 + R() * 58) * u; if (lx + len > x + w - 10 * u) break;
        bar(g, lx, ly, len, 5.5 * u, cols[Math.floor(R() * 6)], 2.5 * u); lx += len + 7 * u;
      }
    }

    if (b.drag) { const r = b.rects.get(b.drag.id); if (r && r.win) { const sp = this.sprite(r.win), k = 1 - .58 * b.drag.k, gw = r.w * k, gh = (r.h - r.th) * k; g.globalAlpha = b.a * .94; g.save(); g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 22 * s * this.dpr; g.shadowOffsetY = 8 * s * this.dpr; bar(g, px - gw * .42, py - gh * .34, gw, gh, '#111', 6 * s); g.restore(); g.drawImage(sp.c, px - gw * .42, py - gh * .34, gw, gh); g.strokeStyle = accent(.9); g.lineWidth = 1.5 * s; rr(g, px - gw * .42, py - gh * .34, gw, gh, 5 * s); g.stroke(); } }
    g.restore();
  }
  drawCursor() {
    const g = this.g, u = this.u, x = this.cur.x * this.W, y = this.cur.y * this.H, k = (this.narrow ? 1.25 : 1.12) * u;
    if (this.ring > .02) { const a = Math.min(1, this.ring), r = (13 + 9 * Math.max(0, this.ring - 1)) * u * 1.25; g.fillStyle = accent(.2 * a); g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.strokeStyle = accent(.95 * a); g.lineWidth = 2 * u; g.stroke(); }
    if (this.mouse.left > .05) { g.strokeStyle = white(.5 * this.mouse.left); g.lineWidth = 1.5 * u; g.beginPath(); g.arc(x, y, 9 * u, 0, 7); g.stroke(); }
    g.save(); g.translate(x, y); g.scale(k, k); g.beginPath();
    [[0, 0], [0, 16.5], [4.3, 12.7], [7.1, 19], [9.7, 17.8], [6.9, 11.7], [12.2, 11.7]].forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath();
    g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 5 * this.dpr; g.shadowOffsetY = 1.5 * this.dpr; g.fillStyle = '#fff'; g.fill(); g.shadowColor = 'transparent';
    g.strokeStyle = '#111'; g.lineWidth = 1.1; g.lineJoin = 'round'; g.stroke(); g.restore();
  }
  /* The hand: a mouse whose side button lights while held and whose body jolts with each flick. */
  drawMouse() {
    const g = this.g, u = this.u * (this.narrow ? .86 : 1), m = this.mouse, bw = 92 * u, bh = 112 * u, bx = this.W - bw - 16 * this.u, by = this.narrow ? 12 * this.u + (1 - this.board.a) * (this.H - this.TB - bh - 26 * this.u) : this.H - this.TB - bh - 14 * this.u;
    bar(g, bx, by, bw, bh, 'rgba(12,13,17,.78)', 22 * u); g.strokeStyle = white(.11); g.lineWidth = 1; rr(g, bx + .5, by + .5, bw - 1, bh - 1, 22 * u); g.stroke();
    if (m.dir && m.da > .03) {
      const v = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] }[m.dir], cx = bx + bw / 2 + v[0] * 35 * u, cy = by + bh / 2 + v[1] * 45 * u, q = 4.5 * u;
      line(g, [[cx - v[0] * q - v[1] * q, cy - v[1] * q - v[0] * q], [cx + v[0] * q, cy + v[1] * q], [cx - v[0] * q + v[1] * q, cy - v[1] * q + v[0] * q]], accent(Math.min(1, m.da * 1.6)), 2 * u);
    }
    const w = 40 * u, h = 62 * u, x = bx + (bw - w) / 2 + clamp(m.x, -15 * u, 15 * u), y = by + (bh - h) / 2 + clamp(m.y, -15 * u, 15 * u), cx = x + w / 2;
    if (m.side > .02) { g.save(); g.shadowColor = ACCENT; g.shadowBlur = 12 * u * this.dpr * m.side; bar(g, x - 7 * u, y + 25 * u, 10 * u, 17 * u, accent(m.side), 4 * u); g.restore(); }
    bar(g, x - 7 * u, y + 25 * u, 10 * u, 17 * u, m.side > .5 ? ACCENT : white(.42), 4 * u);
    rr(g, x, y, w, h, 20 * u); g.fillStyle = '#1b1d24'; g.fill();
    if (m.left > .02) { g.save(); rr(g, x, y, w, h, 20 * u); g.clip(); bar(g, x, y, w / 2, 26 * u, white(.85 * m.left)); g.restore(); }
    g.strokeStyle = white(.8); g.lineWidth = 1.6 * u; rr(g, x, y, w, h, 20 * u); g.stroke();
    line(g, [[x + 1 * u, y + 26 * u], [x + w - 1 * u, y + 26 * u]], white(.45), 1.2 * u); line(g, [[cx, y + 1 * u], [cx, y + 26 * u]], white(.45), 1.2 * u);
    bar(g, cx - 2.6 * u, y + 7 * u, 5.2 * u, 10 * u, '#1b1d24', 2.6 * u); g.strokeStyle = white(.8); g.lineWidth = 1.2 * u; rr(g, cx - 2.6 * u, y + 7 * u, 5.2 * u, 10 * u, 2.6 * u); g.stroke();
  }
  draw() {
    const g = this.g, { W, H, dpr } = this, DH = H - this.TB;
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.globalAlpha = 1;
    g.drawImage(this.wallpaper(), 0, 0, W, H);
    if (this.board.a < .995) {
      if (this.desk) {
        const e = inOut(this.desk.p), d = this.desk.dir, v = { left: [1, 0], right: [-1, 0], up: [0, 1], down: [0, -1] }[d];
        this.drawDesktop(this.desk.from, v[0] * e * W, v[1] * e * H); this.drawDesktop(this.desk.to, -v[0] * (1 - e) * W, -v[1] * (1 - e) * H);
      } else this.drawDesktop(this.grid.cur, 0, 0);
      this.drawTaskbar();
      if (this.grid.alpha > .01) drawMini(g, this.grid, W / 2, H / 2, this.u * (this.narrow ? 1.12 : 1.3), this.grid.alpha);
    }
    if (this.board.a > .005) this.drawBoard();
    this.drawCursor(); this.drawMouse();
    if (this.fade > .01) { g.fillStyle = `rgba(13,14,17,${this.fade})`; g.fillRect(0, 0, W, H); }
  }
  /* --- the visitor takes over --- */
  takeover() {
    this.lastInput = performance.now();
    if (!this.auto) return;
    this.auto = false; this.tween = null; this.held = false; this.mouse.leftOn = false;
    const b = this.board; if (b.open) { b.open = false; b.drag = null; this.onPhase('flick'); }
  }
  idle(now) { if (!this.auto && !this.held && now - this.lastInput > 5000) { this.reset(); this.fade = 1; } }
}

/* ---------- the two small loops: just the switcher ---------- */
class MapLoop {
  constructor(cv, make, moves, labels) { this.cv = cv; this.g = cv.getContext('2d'); this.make = make; this.moves = moves; this.labels = labels; this.visible = false; this.reset(); this.resize(); }
  reset() { this.grid = new Grid(this.make()); this.grid.alpha = 1; this.grid.show = true; this.i = 0; this.next = 1.0; this.t = 0; }
  resize() { const f = fit(this.cv); this.W = f.w; this.H = f.h; this.dpr = f.dpr; this.ink = getComputedStyle(this.cv).color; }
  step(dt) { this.t += dt; if (this.t >= this.next) { this.grid.move(this.moves[this.i]); this.i = (this.i + 1) % this.moves.length; this.next += this.i === 0 ? 1.5 : 1.05; } this.grid.step(dt); }
  draw() {
    const g = this.g, { W, H, dpr } = this, grid = this.grid, rows = grid.m.rows;
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
    const labelW = this.labels ? Math.min(92, W * .2) : 0, cols = this.maxCols || (this.maxCols = 6);
    const s = Math.min(1.55, (W - labelW - 2) / (40 + cols * 53 - 7), (H - 4) / (40 + rows.length * 37 - 7));
    const p = drawMini(g, grid, 0, H / 2, s, 1, labelW + 1);
    if (this.labels) rows.forEach((row, r) => { g.globalAlpha = r === grid.cur.r ? 1 : .42; txt(g, tr(row.name), 0, p.Y(r) + p.CH / 2 + 1, Math.max(13, 15 * s), this.ink, 500); g.globalAlpha = 1; });
  }
}

/* ---------- wiring ---------- */
applyLang();
ICON_IMG.src = 'icon.png';
const hero = new Hero(document.getElementById('hero'));
const beat1 = new MapLoop(document.getElementById('beat1'), () => plain({ r: 0, c: 0 }, [[{ ko: '개발', en: 'Dev' }, 3, null], [{ ko: '디자인', en: 'Design' }, 5, 2], [{ ko: '일상', en: 'Life' }, 2, null]]), ['right', 'right', 'right', 'left', 'left', 'left'], true);
beat1.maxCols = 5;
const beat2 = new MapLoop(document.getElementById('beat2'), () => plain({ r: 0, c: 3 }, [['', 4, null], ['', 3, null], ['', 2, 1]]), ['down', 'right', 'right', 'up', 'down', 'left', 'left', 'up'], false);
beat2.maxCols = 6;
const scenes = [hero, beat1, beat2];

const words = [...document.querySelectorAll('#line span')], sub = document.getElementById('sub'), keys = document.getElementById('keys');
let beatTimer = 0;
hero.onBeat = i => { words.forEach((w, j) => w.classList.toggle('on', j === i)); clearTimeout(beatTimer); beatTimer = setTimeout(() => words.forEach(w => w.classList.remove('on')), 650); };
hero.onPhase = p => { sub.dataset.phase = p; };
hero.onDir = d => { const k = keys.querySelector('.' + d[0]); if (!k) return; k.classList.add('on'); setTimeout(() => k.classList.remove('on'), 160); };

function redrawStill() {
  if (!STILL) return;
  hero.seek(FREEZE !== null ? FREEZE : STILL_AT); hero.draw();
  [beat1, beat2].forEach(b => { b.reset(); if (FREEZE !== null) for (let i = 0; i < FREEZE * 60; i++) b.step(1 / 60); b.draw(); });
}
function repaint() { scenes.forEach(s => { if (s.sprites) s.sprites.clear(); }); if (STILL) redrawStill(); }

document.getElementById('lang').addEventListener('click', () => { lang = lang === 'ko' ? 'en' : 'ko'; try { localStorage.setItem('flick-lang', lang); } catch (e) {} applyLang(); repaint(); });
ICON_IMG.onload = repaint;
if (document.fonts) {
  const all = '고정번칸현재창을아래으로끌면옮겨집니다재배치됩니다개발디자인일상오후참고이미지문서받은편지함터미널메모장메일일정';
  Promise.all([400, 500, 600].map(w => document.fonts.load(`${w} 12px "IBM Plex Sans KR"`, all + 'Flick'))).then(repaint, () => {});
}
new ResizeObserver(() => { scenes.forEach(s => s.resize()); if (STILL) redrawStill(); else scenes.forEach(s => s.draw()); }).observe(document.getElementById('stage'));
addEventListener('resize', () => { [beat1, beat2].forEach(s => { s.resize(); s.draw(); }); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { [beat1, beat2].forEach(s => { s.resize(); s.draw(); }); });

if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(es => es.forEach(e => { const s = scenes.find(x => x.cv === e.target); if (s) s.visible = e.isIntersecting; kick(); }), { threshold: .05 });
  scenes.forEach(s => { s.visible = false; io.observe(s.cv); });
} else scenes.forEach(s => { s.visible = true; });

let raf = 0, last = 0;
function frame(now) {
  raf = 0;
  const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
  let any = false;
  scenes.forEach(s => { if (!s.visible) return; any = true; s.step(dt); s.draw(); });
  hero.idle(now);
  if (any && !document.hidden) raf = requestAnimationFrame(frame);
}
function kick() { if (STILL || raf || document.hidden || !scenes.some(s => s.visible)) return; last = performance.now(); raf = requestAnimationFrame(frame); }
document.addEventListener('visibilitychange', kick);
if (STILL) redrawStill(); else kick();

/* Arrow keys and dragging move between desktops by the same rules. */
const stage = document.getElementById('stage');
function settle() { if (!STILL) return; for (let i = 0; i < 90; i++) hero.step(1 / 60); hero.draw(); }
let over = false, drag = null;
stage.addEventListener('pointerenter', () => { over = true; }); stage.addEventListener('pointerleave', () => { over = false; });
addEventListener('keydown', e => {
  const d = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' }[e.key];
  if (!d || e.altKey || e.ctrlKey || e.metaKey) return;
  const focused = document.activeElement === stage, r = stage.getBoundingClientRect(), inView = r.top < innerHeight * .6 && r.bottom > innerHeight * .4;
  if (!(focused || over || (inView && (d === 'left' || d === 'right')))) return;
  e.preventDefault(); hero.takeover(); hero.flick(d); settle();
});
stage.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  const r = stage.getBoundingClientRect(); hero.takeover();
  hero.cur.x = (e.clientX - r.left) / r.width; hero.cur.y = (e.clientY - r.top) / r.height; hero.press();
  drag = { x: e.clientX, y: e.clientY, id: e.pointerId }; try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  settle();
});
stage.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y, th = Math.max(34, stage.clientWidth * .06);
  if (Math.abs(dx) < th && Math.abs(dy) < th) return;
  hero.lastInput = performance.now();
  hero.flick(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  drag.x = e.clientX; drag.y = e.clientY; settle();
});
const end = e => { if (!drag || e.pointerId !== drag.id) return; drag = null; hero.lastInput = performance.now(); hero.release(); settle(); };
stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);
})();
</script>
