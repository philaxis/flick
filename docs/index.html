<title>Flick</title>
<meta name="description" content="Hold a button, flick the mouse, land on the next desktop. Windows 11 virtual desktops as a 2D grid. Free and open source.">
<link rel="alternate" hreflang="ko" href="https://philaxis.github.io/flick/ko/">
<link rel="alternate" hreflang="en" href="https://philaxis.github.io/flick/en/">
<link rel="alternate" hreflang="x-default" href="https://philaxis.github.io/flick/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Flick">
<meta property="og:title" content="Flick — 누르고, 밀면, 옆 데스크톱.">
<meta property="og:description" content="윈도우 11 가상 데스크톱을 2D 격자로. 무료, 오픈 소스. / Hold. Flick. Next desktop. Windows 11 virtual desktops as a 2D grid.">
<!-- Links shared before the page split in two keep their preview. -->
<meta property="og:url" content="https://philaxis.github.io/flick/">
<meta property="og:image" content="https://philaxis.github.io/flick/og.png">
<meta property="og:image:type" content="image/png">

<meta property="og:image:height" content="630">

<link rel="icon" type="image/png" href="icon.png">
<style>:root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d0e11;color:rgba(255,255,255,.62);font:15px/1.6 "Segoe UI",system-ui,sans-serif}a{color:rgba(255,255,255,.92);margin:0 10px}</style>
<script>
/* The page in the browser's own language: Korean for Korean, English for everyone else. ?lang= picks one, as older links did. */
(function () {
  var asked = new URLSearchParams(location.search).get('lang');
  var first = (navigator.languages && navigator.languages[0]) || navigator.language || '';
  var lang = asked === 'ko' || asked === 'en' ? asked : /^ko/i.test(first) ? 'ko' : 'en';
  var rest = location.search.replace(/([?&])lang=[^&]*&?/, '$1').replace(/[?&]$/, '');
  location.replace(lang + '/' + rest + location.hash);
})();
</script>
</head>
<body>
<noscript><a href="en/" hreflang="en">English</a> <a href="ko/" hreflang="ko" lang="ko">한국어</a></noscript>
</body>
</html>
