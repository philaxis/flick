<style>
/* The app's own look (src/paint.rs, src/settings.rs, src/board.rs): one dark
   backdrop, white text at a few strengths, the blue accent, Segoe UI. */
:root{
  --bg:#0d0e11;                       /* paint::backdrop() */
  --ink:rgba(255,255,255,.92);        /* titles */
  --text:rgba(255,255,255,.62);       /* labels */
  --faint:rgba(255,255,255,.38);      /* "More settings" */
  --fill:rgba(255,255,255,.10);       /* a button */
  --fill-hot:rgba(255,255,255,.20);
  --line:rgba(255,255,255,.08);
  --accent:#579eff;                   /* paint::accent() */
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --gut:16px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font);padding-inline:var(--gut);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:7px}
.col{width:min(1160px,100%,max(560px,(100svh - 250px)*16/9));margin-inline:auto}

.top{display:flex;align-items:center;justify-content:space-between;height:72px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;color:var(--ink)}
.brand img{width:24px;height:24px;display:block}
.top nav{display:flex;align-items:center;gap:8px}
/* Settings' buttons: a faint fill, 7px corners, the text a little dimmed until pointed at. */
.btn{display:inline-flex;align-items:center;height:32px;padding:0 14px;border:0;border-radius:7px;background:var(--fill);color:rgba(255,255,255,.85);font:500 13px/1 var(--font);cursor:pointer;transition:background .12s,color .12s}
.btn:hover{background:var(--fill-hot);color:#fff}

.say{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;padding-block:clamp(28px,6vw,72px) 32px}
h1{margin:0;font-weight:600;letter-spacing:-.025em;line-height:1.08;font-size:clamp(32px,4.6vw,58px);color:var(--ink);text-wrap:balance}
h1 span{transition:color .5s ease}
h1 span.on{color:var(--accent);transition-duration:.08s}
/* The selected choice in settings: the accent, filled. */
.dl{flex:none;display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 20px 0 16px;border-radius:7px;background:var(--accent);color:#fff;font-weight:600;font-size:15px;white-space:nowrap;transition:filter .12s}
.dl:hover{filter:brightness(1.1)}
.dl svg{width:16px;height:16px;flex:none}

.stage{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--bg);box-shadow:0 0 0 1px var(--line)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.end{display:flex;align-items:center;gap:24px;margin-top:clamp(96px,14vw,180px);padding-top:32px;border-top:1px solid var(--line)}
.end .brand{font-size:clamp(28px,3.4vw,40px);gap:14px;letter-spacing:-.02em}
.end .brand img{width:clamp(36px,4vw,48px);height:auto}
footer{display:flex;flex-wrap:wrap;gap:8px;padding-block:40px 20px;font-size:13px;color:var(--text)}
footer a{text-decoration:underline;text-decoration-color:rgba(255,255,255,.2);text-underline-offset:3px}
footer a:hover{color:var(--ink)}
.inspiration{margin:0;padding-bottom:48px;max-width:68ch;font-size:12px;line-height:1.7;color:var(--faint)}
.inspiration b{display:block;margin-bottom:4px;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase}

@media (max-width:820px){
  .say{flex-direction:column;align-items:flex-start;gap:22px;padding-bottom:24px}
  h1{font-size:clamp(30px,9.6vw,52px)}
}
@media (max-width:560px){
  .stage{aspect-ratio:16/10}
}

<body>
<div class="col">
  <header class="top">
    <a class="brand" href="https://philaxis.github.io/flick/"><img src="icon.png" alt="" width="24" height="24">Flick</a>
    <nav>
      <button type="button" class="btn" id="lang" data-ko="English" data-en="한국어" data-ko-label="Switch to English" data-en-label="한국어로 보기">English</button>

  <main>
    <section class="hero">

        <a class="dl" href="https://github.com/philaxis/flick/releases/latest/download/Flick.exe">

           data-ko-label="Flick 사용 화면: 마우스 옆 버튼을 누른 채 밀면 옆 데스크톱으로 넘어가고, 한 번 누르면 모든 창이 보입니다."
           data-en-label="Flick in use: hold the mouse side button and flick to land on the next desktop; tap it to see every window."

  <footer>
    <span>MIT</span><span>·</span>
    <a href="https://github.com/philaxis/flick" data-ko="소스" data-en="source">소스</a><span>·</span>
    <span>made by <a href="https://philaxis.github.io">philaxis</a></span>
  </footer>
  <p class="inspiration"><b>Design inspiration</b><span data-ko="Flick의 아이디어는 단백질 접힘 현상에서 일부 영감을 받았습니다. 일렬로 연결된 아미노산들이 접히면서 복잡한 공간 구조를 형성한다는 점이 흥미로웠습니다. 그렇다면 가상 데스크톱도 꼭 일렬로 배치해야 할까요? 우리가 작업을 구분하고 연결하는 방식에 따라 공간적으로 배치할 수는 없을까요?" data-en="The idea for Flick was partly inspired by protein folding — how a linear chain of amino acids can fold into a complex spatial structure. It made me wonder: why should virtual desktops be confined to a single line? What if we could arrange them in a space that better reflects how we organize our work?">Flick의 아이디어는 단백질 접힘 현상에서 일부 영감을 받았습니다. 일렬로 연결된 아미노산들이 접히면서 복잡한 공간 구조를 형성한다는 점이 흥미로웠습니다. 그렇다면 가상 데스크톱도 꼭 일렬로 배치해야 할까요? 우리가 작업을 구분하고 연결하는 방식에 따라 공간적으로 배치할 수는 없을까요?</span></p>
</div>

<script>
(() => {
'use strict';
const FONT = '"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif';
const qs = new URLSearchParams(location.search);
const FREEZE = qs.has('t') ? parseFloat(qs.get('t')) : null;   // ?t=2.4 holds one frame of the loop
// The loop is the page's content, like an embedded video, so it plays even
// where the system asks for reduced motion.
const STILL = FREEZE !== null;

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = t => (t = clamp(t, 0, 1), t * t * (3 - 2 * t));
const follow = (cur, to, dt, tau) => to + (cur - to) * Math.exp(-dt / tau);
const rgba = (r, g, b, a) => `rgba(${Math.round(r * 255)},${Math.round(g * 255)},${Math.round(b * 255)},${a})`;
/* The app's colours (src/paint.rs, src/board.rs). */
const white = a => rgba(1, 1, 1, a);
const accent = a => rgba(.34, .62, 1, a);
const everywhere = a => rgba(1, .74, .34, a);   // pinned to all shelves
const onRow = a => rgba(.32, .86, .82, a);      // pinned to this shelf
const BACKDROP = rgba(.050, .055, .068, 1);
/* The desktop strip (src/follow.rs): GAP between desktops, the others DIM darker. */
const GAP = .07, DIM = .55;
const scaleAt = depth => 1 - .5 * clamp(depth, 0, 1);
const standingOut = (emphasis, receded) => {
  emphasis = clamp(emphasis, 0, 1); receded = clamp(receded, 0, 1);
  return [(1 - (.65 - .15 * emphasis) * receded) / scaleAt(receded), DIM * (1 - emphasis)];
};

/* ---------- language ---------- */
let lang = 'ko';
try { lang = localStorage.getItem('flick-lang') || ''; } catch (e) { lang = ''; }
if (qs.get('lang')) lang = qs.get('lang');
if (lang !== 'ko' && lang !== 'en') lang = (navigator.languages || [navigator.language || 'ko']).some(l => /^ko/i.test(l)) ? 'ko' : 'en';
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-ko]').forEach(el => { el.textContent = el.dataset[lang]; });
  document.querySelectorAll('[data-ko-label]').forEach(el => { el.setAttribute('aria-label', el.dataset[lang + 'Label']); });
}

/* ---------- drawing helpers ---------- */
function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function fill(g, x, y, w, h, r, c) { g.fillStyle = c; rr(g, x, y, w, h, r); g.fill(); }
function txt(g, s, x, y, px, c, weight, align) {
  g.font = `${weight || 400} ${px}px ${FONT}`; g.fillStyle = c; g.textAlign = align || 'left'; g.textBaseline = 'middle'; g.fillText(s, x, y);
}
/* A soft glow of `colour` round a rounded rectangle, as paint::Glow draws it: the shape's blurred shadow, the shape itself kept out of sight. */
function glow(g, x, y, w, h, r, blur, colour) {
  const far = 10000, k = g.getTransform().a;   // shadows are measured in device pixels, untransformed
  g.save(); g.shadowColor = colour; g.shadowBlur = blur * k; g.shadowOffsetX = far * k;
  fill(g, x - far, y, w, h, r, '#000'); g.restore();
}
/* board.rs `surface`: a face standing off the dark, its soft shadow higher the more it is lifted, and a faint line of light along its top. */
function surface(g, x, y, w, h, r, face, alpha, lift, s) {
  glow(g, x, y + (5 + 5 * lift) * s, w, h, r, (34 + 26 * lift) * s * .5, `rgba(0,0,0,${(.36 + .24 * lift) * alpha})`);
  glow(g, x, y + s, w, h, r, (8 + 4 * lift) * s * .5, `rgba(0,0,0,${.5 * alpha})`);
  fill(g, x, y, w, h, r, rgba(face, face + .006, face + .02, alpha));
  const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, white(.055 * alpha)); gr.addColorStop(.5, white(0));
  fill(g, x, y, w, h, r, gr);
  const inset = Math.max(r, 2 * s);
  if (w > 2 * inset) { g.fillStyle = white(.07 * alpha); g.fillRect(x + inset, y + .25 * s, w - 2 * inset, s); }
}

/* ---------- apps: each a plain window and its icon's colour ---------- */
const APPS = {
  editor:   { tone: '#3d8bfd', kind: 'side' },
  browser:  { tone: '#f08a3c', kind: 'page' },
  terminal: { tone: '#8d96a8', kind: 'lines' },
  notes:    { tone: '#e6c34a', kind: 'lines' },
  chat:     { tone: '#8f7cf0', kind: 'list' },
  mail:     { tone: '#3fb6d9', kind: 'list' },
  photos:   { tone: '#e46a9a', kind: 'grid' },
  sheet:    { tone: '#3fae6a', kind: 'grid' },
  music:    { tone: '#e5534b', kind: 'page' },
};
/* An app's icon: a rounded square of its colour with a light mark. */
function icon(g, app, x, y, k) {
  fill(g, x, y, k, k, k * .24, APPS[app].tone);
  fill(g, x + k * .28, y + k * .28, k * .44, k * .44, k * .12, 'rgba(255,255,255,.82)');
}
/* What a window shows, as faint blocks in its body. */
const BODY = {
  side:  [[0, 0, .2, 1], [.24, 0, .76, .08], [.24, .14, .6, .06], [.24, .26, .7, .06], [.24, .38, .5, .06], [.24, .5, .66, .06]],
  page:  [[0, 0, 1, .46], [0, .54, .62, .07], [0, .66, .8, .07], [0, .78, .5, .07]],
  lines: [[0, 0, .7, .07], [0, .13, .9, .07], [0, .26, .55, .07], [0, .39, .8, .07], [0, .52, .62, .07]],
  list:  [[0, 0, .3, 1], [.34, 0, .66, .2], [.34, .26, .66, .2], [.34, .52, .66, .2]],
  grid:  [[0, 0, .31, .46], [.345, 0, .31, .46], [.69, 0, .31, .46], [0, .54, .31, .46], [.345, .54, .31, .46], [.69, .54, .31, .46]],
};
/* A window as it is on a desktop: 8px corners, a title bar with its icon, dark faces as dark-mode apps have. */
function paintWindow(g, win, X, Y, w, h, s) {
  const bar = 30 * s, r = 8 * s, a = APPS[win.app];
  surface(g, X, Y, w, h, r, .165, 1, win.top ? 1 : .3, s);
  icon(g, win.app, X + 12 * s, Y + bar / 2 - 7 * s, 14 * s);
  g.fillStyle = white(.5); [0, 1, 2].forEach(i => g.fillRect(X + w - (18 + 26 * i) * s, Y + bar / 2, 9 * s, Math.max(1, 1.2 * s)));
  const p = 14 * s, cw = w - 2 * p, ch = h - bar - p;
  g.save(); rr(g, X, Y, w, h, r); g.clip();
  BODY[a.kind].forEach((b, i) => fill(g, X + p + b[0] * cw, Y + bar + b[1] * ch, b[2] * cw, b[3] * ch, 4 * s, white(i === 0 && a.kind !== 'lines' && a.kind !== 'grid' ? .06 : .045)));
  g.restore();
}

/* ---------- the grid of desktops: shelves (rows) of desktops ---------- */
const Wn = (app, x, y, w, h, top) => ({ app, r: [x, y, w, h], top: !!top });
const SHELVES = [
  [ [Wn('editor', .1, .09, .62, .78), Wn('terminal', .58, .5, .34, .38)],
    [Wn('browser', .16, .08, .68, .8)],
    [Wn('mail', .08, .12, .5, .72), Wn('chat', .62, .2, .3, .6)] ],
  [ [Wn('photos', .06, .1, .58, .76), Wn('sheet', .5, .3, .4, .55), Wn('notes', .76, .07, .19, .3, true)],
    [Wn('editor', .2, .1, .6, .78)] ],
  [ [Wn('music', .24, .14, .52, .7)],
    [Wn('browser', .1, .1, .5, .76), Wn('notes', .64, .1, .27, .5)] ],
];
/* Windows pinned: one on every desktop, one on every desktop of the second shelf. */
const PINNED_ALL = Wn('music', .74, .66, .21, .26);
const PINNED_ROW = { row: 1, win: Wn('chat', .05, .62, .22, .3) };
const shelfName = r => `Shelf ${r + 1}`;   // grid::row_title for a shelf not yet named

/* ---------- the loop: hold, flick right, right, down, let go; tap for the board; back again ---------- */
const SCRIPT = [
  [.7, h => h.press()],
  [1.2, h => h.drag(1, 0)],
  [2.0, h => h.drag(1, 0)],
  [2.9, h => h.drag(0, 1)],
  [3.8, h => h.release()],
  [5.0, h => h.tap()],
  [8.4, h => h.tap()],
  [9.2, h => h.press()],
  [9.7, h => h.drag(0, -1)],
  [10.5, h => h.drag(-1, 0)],
  [11.2, h => h.drag(-1, 0)],
  [11.9, h => h.release()],
];
const LOOP = 13.4;
const DRAG = .5;   // how long one push of the hand takes

class Hero {
  constructor(cv) {
    this.cv = cv; this.g = cv.getContext('2d'); this.sprites = new Map(); this.visible = true; this.quiet = false;
    this.onBeat = () => {};
    this.reset(); this.resize();
  }
  reset() {
    this.t = 0; this.si = 0;
    this.row = 0; this.col = 0; this.last = SHELVES.map(() => 0);
    this.x = 0; this.y = 0;           // where the strip is: column on the current shelf, and shelf
    this.hand = null;                 // a push under way
    this.held = false; this.receded = 0;
    this.board = { open: false, a: 0 };
  }
  resize() {
    const r = this.cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.W = Math.max(1, Math.round(r.width)); this.H = Math.max(1, Math.round(r.height)); this.dpr = dpr;
    this.cv.width = Math.round(this.W * dpr); this.cv.height = Math.round(this.H * dpr);
    this.u = this.H / 620;                       // one of the app's pixels on this stage
    this.tu = Math.max(this.u, .62);             // the same for text, kept legible on a phone
    this.narrow = this.W < 560;
    this.sprites.clear();
  }
  beat(i) { if (!this.quiet) this.onBeat(i); }
  press() { this.held = true; this.beat(0); }
  release() { this.held = false; this.beat(2); }
  drag(dx, dy) { this.hand = { dx, dy, t0: this.t, x0: this.x, y0: this.y }; this.beat(1); }
  tap() { this.board.open = !this.board.open; }

  step(dt) {
    this.t += dt;
    while (this.si < SCRIPT.length && SCRIPT[this.si][0] <= this.t) SCRIPT[this.si++][1](this);
    if (this.t >= LOOP) this.reset();
    /* The hand pushes; the strip follows it, and the desktop it is nearest is the one chosen. */
    const h = this.hand;
    if (h) {
      const k = ease((this.t - h.t0) / DRAG);
      if (h.dx) this.x = h.x0 + h.dx * k;
      if (h.dy) {
        this.y = h.y0 + h.dy * k;
        const row = clamp(Math.round(this.y), 0, SHELVES.length - 1);
        if (row !== this.row) { this.last[this.row] = this.col; this.row = row; this.col = this.last[row]; this.x = this.col; }
      }
      this.col = clamp(Math.round(this.x), 0, SHELVES[this.row].length - 1);
      if (k >= 1) this.hand = null;
    }
    if (!this.held && !this.hand) { this.x = follow(this.x, this.col, dt, .06); this.y = follow(this.y, this.row, dt, .06); }
    /* Held, the screen recedes; let go, the chosen desktop comes forward. */
    this.receded = follow(this.receded, this.held ? 1 : 0, dt, this.held ? .07 : .09);
    this.board.a = follow(this.board.a, this.board.open ? 1 : 0, dt, .05);
  }
  seek(t) { this.quiet = true; this.reset(); for (let i = 0, n = Math.round(t * 60); i < n; i++) this.step(1 / 60); this.quiet = false; }

  /* One desktop, full size, drawn once: the same dark under every desktop, its windows. */
  desktop(r, c) {
    const key = r + ':' + c; let cv = this.sprites.get(key);
    if (cv) return cv;
    const { W, H, dpr } = this; cv = document.createElement('canvas'); cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const g = cv.getContext('2d'); g.scale(dpr, dpr);
    g.fillStyle = '#1e2127'; g.fillRect(0, 0, W, H);
    SHELVES[r][c].forEach(win => paintWindow(g, win, win.r[0] * W, win.r[1] * H, win.r[2] * W, win.r[3] * H, this.u));
    this.sprites.set(key, cv); return cv;
  }
  /* follow::placed: where a thing `apart` desktops from the strip is drawn, and how dark. */
  place(ax, ay) {
    const { W, H } = this, sc = scaleAt(this.receded), emphasis = clamp(1 - Math.hypot(ax, ay), 0, 1);
    const [lift, dark] = standingOut(emphasis, this.receded), k = sc * lift;
    const cx = W / 2 + ax * W * (1 + GAP) * sc, cy = H / 2 + ay * H * (1 + GAP) * sc;
    return { x: cx - W * k / 2, y: cy - H * k / 2, k, dark: this.receded > .001 ? dark : 0 };
  }
  /* Where shelf `r` stands sideways: the shelf the hand is on goes with the strip, the others wait on the desktop they were left on (follow::step_along). */
  rowX(r) {
    const off = this.x - this.col;
    return (r === this.row ? this.col : this.last[r]) + off * clamp(1 - Math.abs(r - this.y), 0, 1);
  }
  drawGlide() {
    const g = this.g, { W, H } = this;
    g.fillStyle = BACKDROP; g.fillRect(0, 0, W, H);
    SHELVES.forEach((row, r) => row.forEach((_, c) => {
      const p = this.place(c - this.rowX(r), r - this.y);
      if (p.x > W || p.y > H || p.x + W * p.k < 0 || p.y + H * p.k < 0) return;
      g.drawImage(this.desktop(r, c), p.x, p.y, W * p.k, H * p.k);
      if (p.dark > 0) { g.fillStyle = `rgba(0,0,0,${p.dark})`; g.fillRect(p.x, p.y, W * p.k, H * p.k); }
    }));
    /* Pinned windows stay where they are sideways; those of a shelf go up and down with it. */
    const pinned = (win, ay) => {
      const p = this.place(0, ay);
      g.save(); g.translate(p.x, p.y); g.scale(p.k, p.k);
      paintWindow(g, win, win.r[0] * W, win.r[1] * H, win.r[2] * W, win.r[3] * H, this.u);
      if (p.dark > 0) fill(g, win.r[0] * W, win.r[1] * H, win.r[2] * W, win.r[3] * H, 8 * this.u, `rgba(0,0,0,${p.dark})`);
      g.restore();
    };
    if (Math.abs(PINNED_ROW.row - this.y) < 1.5) pinned(PINNED_ROW.win, PINNED_ROW.row - this.y);
    pinned(PINNED_ALL, 0);
    if (this.receded > .01) this.drawBanner();
  }
  /* glide.rs Banner: the shelf's name in a pill above the picture, the names sliding as the shelf changes. */
  drawBanner() {
    const g = this.g, s = this.tu, W = this.W, h = 30 * s, top = 14 * s, a = clamp(this.receded, 0, 1);
    g.font = `400 ${13 * s}px ${FONT}`;
    const shown = SHELVES.map((_, r) => [r, 1 - Math.abs(r - this.y)]).filter(([, k]) => k > 0);
    const wide = clamp(shown.reduce((sum, [r, k]) => sum + (g.measureText(shelfName(r)).width + 28 * s) * k, 0), h * 2, W - 2);
    const x = (W - wide) / 2;
    g.save(); g.globalAlpha = a;
    fill(g, x, top, wide, h, h / 2, rgba(.06, .065, .08, .56));
    g.strokeStyle = white(.10); g.lineWidth = 1; rr(g, x + .5, top + .5, wide - 1, h - 1, h / 2); g.stroke();
    g.save(); rr(g, x, top, wide, h, h / 2); g.clip();
    shown.forEach(([r, k]) => txt(g, shelfName(r), W / 2, top + h / 2 + (r - this.y) * h, 13 * s, white(.92 * k), 400, 'center'));
    g.restore(); g.restore();
  }

  /* ---------- the board (src/board.rs) ---------- */
  boardLayout() {
    const { W, H, u: s, narrow } = this, n = SHELVES.length;
    /* The map: squares 0.62 as tall as wide, the shelves shifted so the desktop each was left on is in one column. */
    const ch = (narrow ? 30 : 46) * s, cw = ch / .62, gap = 8 * s, pitch = cw + gap, rp = ch + gap;
    const anchor = r => r === this.row ? this.col : this.last[r];
    const lead = Math.max(...SHELVES.map((_, r) => anchor(r))), tail = Math.max(...SHELVES.map((row, r) => row.length - anchor(r)));
    const nameW = (narrow ? 70 : 84) * s, mapW = nameW + (lead + tail) * pitch - gap, mapTop = H - n * rp - 30 * s;
    const x0 = (W - mapW) / 2, spineX = x0 + nameW + lead * pitch;
    const cells = SHELVES.map((row, r) => row.map((wins, c) => ({ x: spineX + (c - anchor(r)) * pitch, y: mapTop + r * rp, w: cw, h: ch, wins, r, c })));
    /* Pinned windows at the left, all shelves above this shelf; the chosen desktop's windows as large previews beside them. */
    const top = 58 * s, bottom = mapTop - 34 * s, colW = W * .19, left = 30 * s;
    const pinH = (bottom - top - 24 * s) / 2;
    const pins = [
      { win: PINNED_ALL, kind: 'all', ...this.fitTile(PINNED_ALL, left, top, colW, pinH) },
      ...(this.row === PINNED_ROW.row ? [{ win: PINNED_ROW.win, kind: 'row', ...this.fitTile(PINNED_ROW.win, left, top + pinH + 24 * s, colW, pinH) }] : []),
    ];
    const wins = SHELVES[this.row][this.col], ax = left + colW + 40 * s, aw = W - ax - 40 * s, tg = 26 * s;
    const asp = wins.map(w => (w.r[2] * W) / (w.r[3] * H)), sum = asp.reduce((a, b) => a + b, 0);
    const ph = Math.min(bottom - top - 30 * s, (aw - tg * (wins.length - 1)) / sum);
    let tx = ax + (aw - (sum * ph + tg * (wins.length - 1))) / 2; const ty = top + (bottom - top - ph - 30 * s) / 2;
    const tiles = wins.map((win, i) => { const t = { win, x: tx, y: ty, w: asp[i] * ph, h: ph }; tx += t.w + tg; return t; });
    return { cells, tiles, pins, ch, gap, x0, right: x0 + mapW, spine: { x: spineX - gap / 2, y: mapTop - gap / 2, w: pitch, h: n * rp } };
  }
  fitTile(win, x, y, w, h) {
    const asp = (win.r[2] * this.W) / (win.r[3] * this.H), th = Math.min(h - 30 * this.u, w / asp), tw = th * asp;
    return { x: x + (w - tw) / 2, y: y + (h - 30 * this.u - th) / 2, w: tw, h: th };
  }
  /* A preview: its shadow (deep for one kept on top), the glow of its pin under it, a shrunken picture of the window, its app's icon over its lower left corner. */
  drawTile(t, pin) {
    const g = this.g, s = this.u, { W, H } = this, win = t.win, k = t.w / (win.r[2] * W);
    if (pin) glow(g, t.x + t.w * .08, t.y + t.h * .65, t.w * .84, t.h * .35 + 6 * s, 14 * s, 40 * s, (pin === 'all' ? everywhere : onRow)(.5));
    g.save(); g.translate(t.x, t.y); g.scale(k, k);
    paintWindow(g, win, 0, 0, win.r[2] * W, win.r[3] * H, s);
    g.restore();
    const side = 32 * s; icon(g, win.app, t.x - 6 * s, t.y + t.h - side + 10 * s, side);
  }
  drawBoard() {
    const g = this.g, { W, H, u: s, tu, dpr } = this, L = this.boardLayout(), a = this.board.a;
    g.save(); g.globalAlpha = a;
    g.fillStyle = BACKDROP; g.fillRect(0, 0, W, H);
    /* Where pinned windows go: a pool of their colour on the floor of each place. */
    L.pins.forEach(p => glow(g, p.x + p.w * .12, p.y + p.h + 14 * s, p.w * .76, 6 * s, 3 * s, 70 * s * .5, (p.kind === 'all' ? everywhere : onRow)(.13)));
    const z = .96 + .04 * a;
    g.translate(W / 2, H / 2); g.scale(z, z); g.translate(-W / 2, -H / 2);
    L.pins.forEach(p => this.drawTile(p, p.kind));
    L.tiles.forEach(t => this.drawTile(t, null));
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.globalAlpha = a;
    /* The shelf's name at the top. */
    txt(g, shelfName(this.row), W / 2, 18 * s + 15 * tu, 13.5 * tu, white(.86), 600, 'center');
    /* The map: the column vertical moves travel along, the shelves' names, the cells with their apps' icons, the chosen one raised. */
    fill(g, L.spine.x, L.spine.y, L.spine.w, L.spine.h, 12 * s, 'rgba(0,0,0,.16)');
    /* Windows on every desktop: a thin line of their colour over the map. */
    const ly = L.spine.y - 6 * s, gr = g.createLinearGradient(L.x0, 0, L.right, 0);
    gr.addColorStop(0, everywhere(0)); gr.addColorStop(.5, everywhere(.65)); gr.addColorStop(1, everywhere(0));
    g.fillStyle = gr; g.fillRect(L.x0, ly, L.right - L.x0, 1.2 * s);
    L.cells.forEach((row, r) => txt(g, shelfName(r), L.x0, row[0].y + L.ch / 2, 12 * tu, white(r === this.row ? .86 : .5), r === this.row ? 600 : 400));
    L.cells.forEach(row => row.forEach(c => {
      const chosen = c.r === this.row && c.c === this.col;
      if (chosen) {
        glow(g, c.x - 3 * s, c.y - 3 * s, c.w + 6 * s, c.h + 6 * s, 11 * s, 15 * s, rgba(.80, .86, 1, .14));
        surface(g, c.x - 3 * s, c.y - 3 * s, c.w + 6 * s, c.h + 6 * s, 11 * s, .215, 1, 1, s);
      } else surface(g, c.x, c.y, c.w, c.h, 9 * s, .10 + .075 * Math.min(1, c.wins.length / 3) + (c.r === this.row ? .012 : 0), 1, 0, s);
      if (chosen) { glow(g, c.x + 6.5 * s, c.y + 6.5 * s, 3 * s, 3 * s, 1.5 * s, 5 * s, accent(.5)); g.fillStyle = accent(1); g.beginPath(); g.arc(c.x + 8 * s, c.y + 8 * s, 2.6 * s, 0, 7); g.fill(); }
      const k = Math.min(16 * s, c.h * .36), n = c.wins.length, x = c.x + (c.w - (n * k + (n - 1) * 4 * s)) / 2;
      c.wins.forEach((win, i) => icon(g, win.app, x + i * (k + 4 * s), c.y + (c.h - k) / 2, k));
    }));
    g.restore();
  }

  draw() {
    const g = this.g;
    g.setTransform(this.dpr, 0, 0, this.dpr, 0, 0); g.globalAlpha = 1;
    if (this.board.a < .995) this.drawGlide();
    if (this.board.a > .005) this.drawBoard();
  }
}

/* ---------- wiring ---------- */
applyLang();
const hero = new Hero(document.getElementById('hero'));
const words = [...document.querySelectorAll('#line span')];
let beatTimer = 0;
hero.onBeat = i => { words.forEach((w, j) => w.classList.toggle('on', j === i)); clearTimeout(beatTimer); beatTimer = setTimeout(() => words.forEach(w => w.classList.remove('on')), 650); };

function redrawStill() { hero.seek(FREEZE); hero.draw(); }
document.getElementById('lang').addEventListener('click', () => { lang = lang === 'ko' ? 'en' : 'ko'; try { localStorage.setItem('flick-lang', lang); } catch (e) {} applyLang(); });
new ResizeObserver(() => { hero.resize(); if (STILL) redrawStill(); else hero.draw(); }).observe(hero.cv);

/* Plays by itself, and only while it is on screen. */
if ('IntersectionObserver' in window) { hero.visible = false; new IntersectionObserver(es => { hero.visible = es[es.length - 1].isIntersecting; kick(); }, { threshold: .05 }).observe(hero.cv); }

let raf = 0, last = 0;
function frame(now) {
  raf = 0;
  const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
  if (!hero.visible || document.hidden) return;
  hero.step(dt); hero.draw(); raf = requestAnimationFrame(frame);
}
function kick() { if (STILL || raf || document.hidden || !hero.visible) return; last = performance.now(); raf = requestAnimationFrame(frame); }
document.addEventListener('visibilitychange', kick);
if (STILL) redrawStill(); else kick();
})();
</script>
