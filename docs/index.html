<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flick — 윈도우 11 가상 데스크톱을 2D 격자로</title>
<meta name="description" content="버튼을 누른 채 마우스를 밀면 옆 데스크톱으로 넘어갑니다. 윈도우 11 가상 데스크톱을 2D 격자로 쓰는 무료 오픈 소스 프로그램. Hold a button, flick the mouse, land on the next desktop. Free and open source for Windows 11.">

<meta property="og:description" content="윈도우 11 가상 데스크톱을 2D 격자로. 무료, 오픈 소스. / Hold. Flick. Next desktop. Windows 11 virtual desktops as a 2D grid.">

<style>
/* Layout: one column as wide as the screen-shaped stage; the line and the download sit on its top edge. */
:root{
  --bg:#f3f4f7; --ink:#12141a; --mute:#646a78; --line:rgba(18,20,26,.14);
  --accent:#579eff; --accent-ink:#2a6fe6; --on-accent:#06101f;
  --stage-shadow:0 44px 90px -38px rgba(22,34,66,.55), 0 0 0 1px rgba(18,20,26,.22);
  --font:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --gut:20px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#08090b; --ink:#eef0f4; --mute:#8b919d; --line:rgba(255,255,255,.14);
    --accent-ink:#579eff;
    --stage-shadow:0 0 0 1px rgba(255,255,255,.12);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--font);padding-inline:var(--gut);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:3px;border-radius:6px}
.col{width:min(1240px,100%,max(600px,(100svh - 236px)*16/9));margin-inline:auto}

.top{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand img{width:28px;height:28px;display:block}
.top nav{display:flex;align-items:center;gap:22px;font-size:14px;font-weight:500;color:var(--mute)}
.top nav a:hover,.top nav button:hover{color:var(--ink)}
.top nav button{font:inherit;color:inherit;background:none;border:0;padding:6px 0;cursor:pointer}

.say{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;padding-block:10px 30px}
h1{margin:0;font-weight:700;letter-spacing:-.035em;line-height:1.04;font-size:clamp(34px,5.6vw,76px);text-wrap:balance}
:lang(en) h1{font-size:clamp(34px,4.7vw,64px);letter-spacing:-.04em}
h1 span{transition:color .5s ease}
h1 span.on{color:var(--accent-ink);transition-duration:.08s}
.say .dl{flex:none;margin-bottom:6px}
.dl{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 22px 0 18px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:17px;white-space:nowrap;transition:transform .15s ease,filter .15s ease}
.dl:hover{filter:brightness(1.08);transform:translateY(-1px)}
.dl:active{transform:translateY(0)}
.dl svg{width:18px;height:18px;flex:none}

.stage{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#17212e;box-shadow:var(--stage-shadow)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.end{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:clamp(80px,12vw,170px);padding-top:34px;border-top:1px solid var(--line)}
.end .brand{font-size:clamp(34px,5vw,64px);gap:18px;letter-spacing:-.035em}
.end .brand img{width:clamp(44px,5.4vw,70px);height:auto}
footer{display:flex;gap:8px;padding-block:44px 40px;font-size:13px;color:var(--mute)}
footer a{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
footer a:hover{color:var(--ink)}

@media (max-width:820px){
  .say{flex-direction:column;align-items:flex-start;gap:22px;padding-bottom:26px}
  h1,:lang(en) h1{font-size:clamp(34px,10.4vw,60px)}
}
@media (max-width:640px){
  :root{--gut:16px}
  .col{width:100%}
  .top{height:58px}
  .stage{aspect-ratio:5/4;border-radius:12px}
  .end{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div class="col">
  <header class="top">
    <a class="brand" href="https://philaxis.github.io/flick/"><img src="icon.png" alt="" width="28" height="28">Flick</a>
    <nav>
      <button type="button" id="lang" data-ko="English" data-en="한국어" data-ko-label="Switch to English" data-en-label="한국어로 보기">English</button>
      <a href="https://github.com/philaxis/flick">GitHub</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="say">
        <h1 id="line"><span data-ko="누르고," data-en="Hold.">누르고,</span> <span data-ko="밀면," data-en="Flick.">밀면,</span> <span data-ko="옆 데스크톱." data-en="Next desktop.">옆 데스크톱.</span></h1>
        <a class="dl" href="https://github.com/philaxis/flick/releases/latest/download/Flick.exe">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5v9M5 8l4 4 4-4M3 15.5h12"/></svg>
          <span data-ko="다운로드" data-en="Download">다운로드</span>
        </a>
      </div>

      <div class="stage" id="stage" role="img"
           data-ko-label="Flick 사용 화면: 마우스 옆 버튼을 누른 채 밀면 옆 데스크톱으로 넘어가고, 한 번 누르면 모든 창이 보입니다."
           data-en-label="Flick in use: hold the mouse side button and flick to land on the next desktop; tap it to see every window."
           aria-label="Flick 사용 화면">
        <canvas id="hero"></canvas>
      </div>
    </section>

    <section class="end">
      <div class="brand"><img src="icon.png" alt="" width="70" height="70">Flick</div>
      <a class="dl" href="https://github.com/philaxis/flick/releases/latest/download/Flick.exe">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5v9M5 8l4 4 4-4M3 15.5h12"/></svg>
        <span data-ko="다운로드" data-en="Download">다운로드</span>
      </a>
    </section>
  </main>

  <footer>
    <span>MIT</span><span>·</span>
    <a href="https://github.com/philaxis/flick" data-ko="소스" data-en="source">소스</a><span>·</span>
    <span>made by <a href="https://philaxis.github.io">philaxis</a></span>
  </footer>
</div>

<script>
(() => {
'use strict';
const ACCENT = '#579eff';
const FONT = '"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif';
const qs = new URLSearchParams(location.search);
const FREEZE = qs.has('t') ? parseFloat(qs.get('t')) : null;   // ?t=3.6 holds one frame of the loop
// The loop is the page's content, like an embedded video, so it plays even
// where the system asks for reduced motion (Windows reports that whenever
// its animation effects are off, which left desktop visitors a still image).
const STILL = FREEZE !== null;

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const inOut = t => (t = clamp(t, 0, 1), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const follow = (cur, to, dt, tau) => to + (cur - to) * Math.exp(-dt / tau);
const white = a => `rgba(255,255,255,${a})`;
const accent = a => `rgba(87,158,255,${a})`;

/* ---------- language ---------- */
let lang = 'ko';
try { lang = localStorage.getItem('flick-lang') || ''; } catch (e) { lang = ''; }
if (qs.get('lang')) lang = qs.get('lang');
if (lang !== 'ko' && lang !== 'en') lang = (navigator.languages || [navigator.language || 'ko']).some(l => /^ko/i.test(l)) ? 'ko' : 'en';
const tr = v => (v && typeof v === 'object') ? v[lang] : v;
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-ko]').forEach(el => { el.textContent = el.dataset[lang]; });
  document.querySelectorAll('[data-ko-label]').forEach(el => { el.setAttribute('aria-label', el.dataset[lang + 'Label']); });
}

/* ---------- drawing helpers ---------- */
function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function bar(g, x, y, w, h, c, r) { g.fillStyle = c; if (r) { rr(g, x, y, w, h, r); g.fill(); } else g.fillRect(x, y, w, h); }
function txt(g, s, x, y, px, c, weight, align) {
  g.font = `${weight || 400} ${px}px ${FONT}`; g.fillStyle = c; g.textAlign = align || 'left'; g.textBaseline = 'middle'; g.fillText(s, x, y);
}

/* ---------- the demo desktops: one tint each, one or two plain windows ---------- */
const TINTS = {            // wallpaper from, wallpaper to, the colour of the blocks inside its windows
  teal:   ['#0d2a2e', '#216168', '#35a89f'],
  amber:  ['#33230d', '#80591f', '#e3a640'],
  violet: ['#1e1638', '#55439a', '#8f76e3'],
  rose:   ['#351420', '#863552', '#e27397'],
  green:  ['#11281a', '#2f6d46', '#56b47a'],
  slate:  ['#151c28', '#3c4f6a', '#8195b3'],
};
/* Soft blocks inside a window, as fractions of its content box: x, y, w, h, strength. */
const BLOCKS = {
  side: [[0, 0, .22, 1, .28], [.25, 0, .75, .58, .9], [.25, .63, .36, .37, .28], [.64, .63, .36, .37, .28]],
  hero: [[0, 0, 1, .5, .9], [0, .56, .31, .44, .28], [.345, .56, .31, .44, .28], [.69, .56, .31, .44, .28]],
  list: [[0, 0, 1, .29, .9], [0, .355, 1, .29, .28], [0, .71, 1, .29, .28]],
  cols: [[0, 0, .48, 1, .9], [.52, 0, .48, .47, .28], [.52, .53, .48, .47, .28]],
  one:  [[0, 0, 1, .62, .9], [0, .69, .6, .31, .28]],
};
function paintWindow(g, win, w, h, u) {
  const c = TINTS[win.tint][2], top = 26 * u, p = 16 * u;
  g.save(); rr(g, 0, 0, w, h, 10 * u); g.clip();
  bar(g, 0, 0, w, h, '#f5f6f9'); bar(g, 0, 0, w, top, '#e6e8ee');
  bar(g, 12 * u, top / 2 - 4 * u, 8 * u, 8 * u, c, 4 * u);
  txt(g, tr(win.label), 27 * u, top / 2 + .5 * u, 10.5 * u, '#565c6b', 500);
  for (let i = 0; i < 3; i++) bar(g, w - (20 + i * 13) * u, top / 2 - 3 * u, 6 * u, 6 * u, '#c3c8d2', 3 * u);
  const cw = w - 2 * p, ch = h - top - 2 * p;
  BLOCKS[win.kind].forEach(b => { g.globalAlpha = b[4]; bar(g, p + b[0] * cw, top + p + b[1] * ch, b[2] * cw, b[3] * ch, c, 8 * u); });
  g.restore();
}

/* ---------- the grid, with the real navigation rules ---------- */
let WIN_ID = 0;
const W = (label, kind, x, y, w, h) => ({ id: ++WIN_ID, label, kind, r: [x, y, w, h] });
const D = (tint, ...wins) => ({ tint, wins: wins.map(w => Object.assign(w, { tint })) });
function heroModel() {
  WIN_ID = 0;
  const solo = (tint, ko, en) => D(tint, W({ ko, en }, 'one', .2, .14, .6, .68));
  return { cur: { r: 0, c: 0 }, rows: [
    { name: '', last: null, cells: [
      D('teal', W({ ko: '편집기', en: 'Editor' }, 'side', .14, .1, .72, .76)),
      D('amber', W({ ko: '브라우저', en: 'Browser' }, 'hero', .05, .1, .41, .76), W({ ko: '메모', en: 'Notes' }, 'list', .49, .1, .41, .76)),
      solo('slate', '터미널', 'Terminal') ] },
    { name: '', last: null, cells: [
      D('violet', W({ ko: '디자인', en: 'Design' }, 'cols', .06, .09, .54, .78), W({ ko: '채팅', en: 'Chat' }, 'list', .62, .3, .29, .57)),
      solo('rose', '사진', 'Photos'),
      solo('green', '표', 'Sheet') ] },
    { name: '', last: null, cells: [
      solo('green', '음악', 'Music'),
      solo('rose', '메일', 'Mail') ] },
  ] };
}

class Grid {
  constructor(model) {
    this.m = model; this.cur = { ...model.cur }; this.show = false; this.alpha = 0;
    this.shifts = model.rows.map((_, r) => this.shift(r)); this.hl = { x: this.lead(), y: this.cur.r }; this.colsE = this.columns(); this.leadE = this.lead();
  }
  anchor(r) { return r === this.cur.r ? this.cur.c : (this.m.rows[r].last ?? 0); }
  lead() { return Math.max(...this.m.rows.map((_, r) => this.anchor(r))); }
  shift(r) { return this.lead() - this.anchor(r); }
  columns() { return this.lead() + Math.max(1, ...this.m.rows.map((row, r) => row.cells.length - this.anchor(r))); }
  /* The app names an unnamed workspace by its number. */
  name(r) { return tr(this.m.rows[r].name) || tr({ ko: `워크스페이스 ${r + 1}`, en: `Workspace ${r + 1}` }); }
  /* Left/right stay in the row and stop at its ends; up/down land on the cell that row was last left on (its first if never visited). */
  target(dir) {
    const { r, c } = this.cur, rows = this.m.rows;
    if (dir === 'left') return c > 0 ? { r, c: c - 1 } : null;
    if (dir === 'right') return c + 1 < rows[r].cells.length ? { r, c: c + 1 } : null;
    const nr = dir === 'up' ? r - 1 : r + 1;
    if (nr < 0 || nr >= rows.length) return null;
    return { r: nr, c: Math.min(rows[nr].last ?? 0, rows[nr].cells.length - 1) };
  }
  move(dir) {
    const to = this.target(dir);
    if (!to) return false;
    this.m.rows[this.cur.r].last = this.cur.c; this.cur = to;
    return true;
  }
  step(dt) {
    const tau = .085;
    this.m.rows.forEach((_, r) => { this.shifts[r] = follow(this.shifts[r], this.shift(r), dt, tau); });
    this.hl.x = follow(this.hl.x, this.lead(), dt, tau); this.hl.y = follow(this.hl.y, this.cur.r, dt, tau);
    this.colsE = follow(this.colsE, this.columns(), dt, tau); this.leadE = follow(this.leadE, this.lead(), dt, tau);
    this.alpha = follow(this.alpha, this.show ? 1 : 0, dt, this.show ? .05 : .11);
  }
}

/* Flick's switcher: the panel the real overlay draws (same proportions and opacities), the workspace's name under the grid. */
const MINI_TITLE = 26;
function drawMini(g, grid, cx, cy, s, alpha) {
  const CW = 46 * s, CH = 30 * s, GAP = 7 * s, PAD = 20 * s, rows = grid.m.rows;
  const pw = PAD * 2 + grid.colsE * (CW + GAP) - GAP, ph = PAD * 2 + rows.length * (CH + GAP) - GAP + MINI_TITLE * s;
  const x0 = cx - pw / 2, y0 = cy - ph / 2;
  const X = c => x0 + PAD + c * (CW + GAP), Y = r => y0 + PAD + r * (CH + GAP);
  g.save(); g.globalAlpha *= alpha;
  rr(g, x0, y0, pw, ph, 16 * s); g.fillStyle = 'rgba(19,20,24,.86)'; g.fill(); g.strokeStyle = white(.10); g.lineWidth = 1; g.stroke();
  g.save(); rr(g, x0 + 3 * s, y0, pw - 6 * s, ph, 14 * s); g.clip();
  bar(g, X(grid.leadE) - GAP / 2, y0 + PAD - GAP / 2, CW + GAP, rows.length * (CH + GAP), white(.045), 10 * s);
  rows.forEach((row, r) => row.cells.forEach((_, c) => bar(g, X(c + grid.shifts[r]), Y(r), CW, CH, white(r === grid.cur.r ? .17 : .08), 7 * s)));
  txt(g, grid.name(grid.cur.r), x0 + pw / 2, y0 + ph - (PAD * .55 + MINI_TITLE * s / 2), 13 * s, white(.88), 600, 'center');
  g.restore();
  const hx = X(grid.hl.x), hy = Y(grid.hl.y);
  [[5, .07], [3, .12], [1.5, .20]].forEach(([k, a]) => bar(g, hx - k * s, hy - k * s, CW + 2 * k * s, CH + 2 * k * s, accent(a), (7 + k) * s));
  bar(g, hx, hy, CW, CH, ACCENT, 7 * s);
  g.restore();
}

function fit(cv) {
  const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2), w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  return { w, h, dpr };
}

/* ---------- hero: a desktop, Flick's switcher and the board, played on a loop ---------- */
const HOME = { x: .45, y: .79 }, HOP = { x: .09, y: .09 };
const SCRIPT = [
  [1.2, h => h.press()],
  [2.1, h => h.flick('right')],
  [3.7, h => h.flick('down')],
  [5.2, h => h.release()],
  [6.2, h => h.tap()],
  [6.9, h => h.cursorTo(h.tilePoint(), .8)],
  [7.9, h => h.grab()],
  [8.1, h => h.cursorTo(h.cellPoint(1, 2), 1.2)],
  [9.6, h => h.drop()],
  [10.0, h => h.cursorTo({ x: HOME.x + HOP.x, y: HOME.y + HOP.y }, .7)],
  [10.9, h => h.tap()],
  [11.9, h => h.press()],
  [12.6, h => h.flick('up')],
  [13.9, h => h.flick('left')],
  [15.0, h => h.release()],
];
const LOOP = 15.9, STILL_AT = 3.0;   // the loop ends on the desktop it starts on

class Hero {
  constructor(cv) {
    this.cv = cv; this.g = cv.getContext('2d'); this.sprites = new Map(); this.walls = new Map(); this.visible = true; this.quiet = false;
    this.onBeat = () => {};
    this.reset(); this.resize();
  }
  reset() {
    this.grid = new Grid(heroModel()); this.t = 0; this.si = 0; this.held = false; this.hideAt = 0;
    this.cur = { ...HOME }; this.tween = null; this.ring = 0; this.pulse = 0; this.grip = 0; this.trail = null; this.beatAt = null; this.hand = { x: 0, y: 0, side: 0 };
    this.board = { open: false, a: 0, cell: null, rects: new Map(), drag: null, drop: null };
  }
  resize() {
    const f = fit(this.cv); this.W = f.w; this.H = f.h; this.dpr = f.dpr;
    this.narrow = this.W < 560; this.u = this.H / (this.narrow ? 400 : 562); this.TB = 22 * this.u;
    this.sprites.clear(); this.walls.clear();
  }
  cell(pos) { return this.grid.m.rows[pos.r].cells[pos.c]; }
  beat(i) { if (!this.quiet) this.onBeat(i); }
  press() { this.held = true; this.ring = 1.6; this.beat(0); }
  release() { this.held = false; this.hideAt = this.t + .5; }
  /* The screen changes at once; only the cursor hops and the switcher's highlight glides. */
  flick(dir) {
    const v = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] }[dir];
    this.trail = { x: this.cur.x, y: this.cur.y, a: 1 }; this.hand.x = v[0]; this.hand.y = v[1];
    this.cursorTo({ x: this.cur.x + v[0] * HOP.x, y: this.cur.y + v[1] * HOP.y }, .16);
    this.beat(1);
    if (this.grid.move(dir)) this.beatAt = this.t + .28;
  }
  tap() {
    this.pulse = 1; const b = this.board;
    if (b.open) { b.open = false; b.drag = null; return; }

/* ---------- wiring ---------- */
applyLang();
const hero = new Hero(document.getElementById('hero'));
const words = [...document.querySelectorAll('#line span')];
let beatTimer = 0;

}

document.addEventListener('visibilitychange', kick);
if (STILL) redrawStill(); else kick();
})();
