<head>

<title>Flick — 윈도우 11 가상 데스크톱을 2D 격자로</title>
<meta name="description" content="버튼을 누른 채 마우스를 밀면 옆 데스크톱으로 넘어갑니다. 윈도우 11 가상 데스크톱을 2D 격자로 쓰는 무료 오픈 소스 프로그램. Hold a button, flick the mouse, land on the next desktop. Free and open source for Windows 11.">

<meta property="og:site_name" content="Flick">

<style>
/* Draft D — Hardware: a plain white page, a big centred line, the demo on the screen of a laptop. */
:root{
  --bg:#ffffff; --ink:#1d1d1f; --mute:#6e6e73; --line:#d2d2d7;
  --accent:#0071e3; --accent-ink:#0066cc;
  --alu1:#e6e7ea; --alu2:#b4b6bb; --alu3:#8e9096; --lid-edge:#a9abb0;
  --font:"Inter","IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --gut:22px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000; --ink:#f5f5f7; --mute:#86868b; --line:#333336; --accent:#0071e3; --accent-ink:#2997ff; --alu1:#55575c; --alu2:#2e2f33; --alu3:#1d1e21; --lid-edge:#4a4b50; color-scheme:dark}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.47 var(--font);padding-inline:var(--gut);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:3px;border-radius:6px}
.col{width:min(1080px,100%,max(560px,(100svh - 330px)*16/9*1.05));margin-inline:auto}

.top{display:flex;align-items:center;justify-content:space-between;height:48px;border-bottom:1px solid var(--line);font-size:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand img{width:22px;height:22px;display:block}
.top nav{display:flex;align-items:center;gap:22px;color:var(--mute)}
.top nav a:hover,.top nav button:hover{color:var(--ink)}
.top nav button{font:inherit;color:inherit;background:none;border:0;padding:6px 0;cursor:pointer}

.say{display:flex;flex-direction:column;align-items:center;text-align:center;gap:26px;padding-block:58px 50px}
h1{margin:0;font-weight:700;letter-spacing:-.05em;line-height:1.02;font-size:clamp(40px,7.4vw,100px);text-wrap:balance}
:lang(en) h1{font-size:clamp(40px,6.6vw,90px)}
h1 span{transition:color .5s ease}
h1 span.on{color:var(--accent-ink);transition-duration:.08s}
.dl{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 22px 0 18px;border-radius:999px;background:var(--accent);color:#fff;font-weight:500;font-size:17px;white-space:nowrap;transition:background .2s ease}
.dl:hover{background:#0077ed}
.dl svg{width:16px;height:16px;flex:none}

/* The laptop: a black lid with a notch, an aluminium edge, and the base with its thumb cut-out. */
.mac{margin:0 6.5%}
.lid{position:relative;padding:2.1% 2.1% 2.4%;border-radius:20px 20px 8px 8px;background:#0a0a0c;box-shadow:0 0 0 1.5px var(--lid-edge),inset 0 0 0 1px #2c2c30}
.notch{position:absolute;z-index:1;left:50%;top:2.1%;width:12%;height:3.6%;transform:translateX(-50%);border-radius:0 0 9px 9px;background:#0a0a0c}
.notch::after{content:"";position:absolute;left:50%;top:38%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#1d2230;box-shadow:inset 0 0 0 1px #2a3346}
.stage{position:relative;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:#0b1020}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.base{position:relative;margin:0 -7%;height:clamp(10px,1.5vw,18px);border-radius:2px 2px 50% 50%/2px 2px 100% 100%;background:linear-gradient(var(--alu1),var(--alu2) 55%,var(--alu3));box-shadow:0 26px 34px -22px rgba(0,0,0,.45)}
.base::before{content:"";position:absolute;left:50%;top:0;width:15%;height:48%;transform:translateX(-50%);border-radius:0 0 12px 12px;background:linear-gradient(var(--alu3),var(--alu2));opacity:.55}

.end{display:flex;flex-direction:column;align-items:center;margin-top:clamp(100px,14vw,180px);padding-top:40px;border-top:1px solid var(--line)}
.end .brand{font-size:clamp(34px,5vw,64px);font-weight:700;gap:18px;letter-spacing:-.04em}
.end .brand img{width:clamp(44px,5.4vw,70px);height:auto}
footer{display:flex;justify-content:center;gap:8px;padding-block:36px 18px;font-size:12px;color:var(--mute)}
.inspiration{margin:0 auto;padding-bottom:44px;max-width:64ch;text-align:center;font-size:12px;line-height:1.7;color:var(--mute)}
.inspiration b{display:block;margin-bottom:4px;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
footer a{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
footer a:hover{color:var(--ink)}

@media (max-width:820px){
  .say{padding-block:40px 40px}
  h1,:lang(en) h1{font-size:clamp(38px,11vw,64px)}
}
@media (max-width:640px){
  :root{--gut:16px}
  .col{width:100%}
  .mac{margin:0 4%}
  .lid{padding:2.6% 2.6% 3%;border-radius:12px 12px 5px 5px}
  .notch{top:2.6%;width:16%;height:4.4%;border-radius:0 0 6px 6px}
  .notch::after{width:3px;height:3px;margin-left:-1.5px}
  .base{margin:0 -4.5%}
  .stage{aspect-ratio:5/4;border-radius:3px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="col">
  <header class="top">
    <a class="brand" href="https://philaxis.github.io/flick/"><img src="../icon.png" alt="" width="28" height="28">Flick</a>
    <nav>
      <button type="button" id="lang" data-ko="English" data-en="한국어" data-ko-label="Switch to English" data-en-label="한국어로 보기">English</button>
      <a href="https://github.com/philaxis/flick">GitHub</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="say">
        <h1 id="line"><span data-ko="누르고," data-en="Hold.">누르고,</span> <span data-ko="밀면," data-en="Flick.">밀면,</span> <span data-ko="옆 데스크톱." data-en="Next desktop.">옆 데스크톱.</span></h1>
        <a class="dl" href="https://github.com/philaxis/flick/releases/latest/download/Flick.exe">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5v9M5 8l4 4 4-4M3 15.5h12"/></svg>
          <span data-ko="다운로드" data-en="Download">다운로드</span>
        </a>
      </div>

      <div class="mac"><div class="lid"><i class="notch"></i>
      <div class="stage" id="stage" role="img"
           data-ko-label="Flick 사용 화면: 마우스 옆 버튼을 누른 채 밀면 옆 데스크톱으로 넘어가고, 한 번 누르면 모든 창이 보입니다."
           data-en-label="Flick in use: hold the mouse side button and flick to land on the next desktop; tap it to see every window."
           aria-label="Flick 사용 화면">
        <canvas id="hero"></canvas>
      </div>
      </div><div class="base"></div></div>
    </section>

    <section class="end">
      <div class="brand"><img src="../icon.png" alt="" width="70" height="70">Flick</div>
    </section>
  </main>

  <footer>
    <span>MIT</span><span>·</span>
    <a href="https://github.com/philaxis/flick" data-ko="소스" data-en="source">소스</a><span>·</span>
    <span>made by <a href="https://philaxis.github.io">philaxis</a></span>
  </footer>
  <p class="inspiration"><b>Design inspiration</b><span data-ko="Flick의 아이디어는 단백질 접힘 현상에서 일부 영감을 받았습니다. 일렬로 연결된 아미노산들이 접히면서 복잡한 공간 구조를 형성한다는 점이 흥미로웠습니다. 그렇다면 가상 데스크톱도 꼭 일렬로 배치해야 할까요? 우리가 작업을 구분하고 연결하는 방식에 따라 공간적으로 배치할 수는 없을까요?" data-en="The idea for Flick was partly inspired by protein folding — how a linear chain of amino acids can fold into a complex spatial structure. It made me wonder: why should virtual desktops be confined to a single line? What if we could arrange them in a space that better reflects how we organize our work?">Flick의 아이디어는 단백질 접힘 현상에서 일부 영감을 받았습니다. 일렬로 연결된 아미노산들이 접히면서 복잡한 공간 구조를 형성한다는 점이 흥미로웠습니다. 그렇다면 가상 데스크톱도 꼭 일렬로 배치해야 할까요? 우리가 작업을 구분하고 연결하는 방식에 따라 공간적으로 배치할 수는 없을까요?</span></p>
</div>

<script>
(() => {
'use strict';
const qs = new URLSearchParams(location.search);
const FREEZE = qs.has('t') ? parseFloat(qs.get('t')) : null;   // ?t=3.6 holds one frame of the loop
// The loop is the page's content, like an embedded video, so it plays even
// where the system asks for reduced motion (Windows reports that whenever
// its animation effects are off, which left desktop visitors a still image).
const STILL = FREEZE !== null;

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const inOut = t => (t = clamp(t, 0, 1), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const follow = (cur, to, dt, tau) => to + (cur - to) * Math.exp(-dt / tau);
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
const white = a => `rgba(255,255,255,${a})`;
const black = a => `rgba(0,0,0,${a})`;

/* ---------- language ---------- */
let lang = 'ko';
try { lang = localStorage.getItem('flick-lang') || ''; } catch (e) { lang = ''; }
if (qs.get('lang')) lang = qs.get('lang');
if (lang !== 'ko' && lang !== 'en') lang = (navigator.languages || [navigator.language || 'ko']).some(l => /^ko/i.test(l)) ? 'ko' : 'en';
const tr = v => (v && typeof v === 'object') ? v[lang] : v;
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-ko]').forEach(el => { el.textContent = el.dataset[lang]; });
  document.querySelectorAll('[data-ko-label]').forEach(el => { el.setAttribute('aria-label', el.dataset[lang + 'Label']); });
}

/* ---------- drawing helpers ---------- */
let FONT = 'system-ui,sans-serif';
function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function bar(g, x, y, w, h, c, r) { g.fillStyle = c; if (r) { rr(g, x, y, w, h, r); g.fill(); } else g.fillRect(x, y, w, h); }
function ring(g, x, y, w, h, c, lw, r) { g.strokeStyle = c; g.lineWidth = lw; rr(g, x, y, w, h, r || 0); g.stroke(); }
function dot(g, x, y, r, c) { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
function line(g, x0, y0, x1, y1, c, lw) { g.strokeStyle = c; g.lineWidth = lw; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
function txt(g, s, x, y, px, c, weight, align) {
  g.font = `${weight || 400} ${px}px ${FONT}`; g.fillStyle = c; g.textAlign = align || 'left'; g.textBaseline = 'middle'; g.fillText(s, x, y);
}
/* A repeatable scatter, so a wallpaper looks the same every time it is painted. */
function seeded(seed) { let s = 0; for (const ch of String(seed)) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
/* Blurs what is already on the canvas behind a shape, for glass panels. */
function frost(g, hero, blur) {
  g.save(); g.clip(); g.filter = `blur(${blur}px)`;
  g.drawImage(hero.cv, 0, 0, hero.cv.width, hero.cv.height, 0, 0, hero.W, hero.H);
  g.restore();
}

/* Soft blocks inside a window, as fractions of its content box: x, y, w, h, strength. */
const BLOCKS = {
  side: [[0, 0, .22, 1, .28], [.25, 0, .75, .58, .9], [.25, .63, .36, .37, .28], [.64, .63, .36, .37, .28]],
  hero: [[0, 0, 1, .5, .9], [0, .56, .31, .44, .28], [.345, .56, .31, .44, .28], [.69, .56, .31, .44, .28]],
  list: [[0, 0, 1, .29, .9], [0, .355, 1, .29, .28], [0, .71, 1, .29, .28]],
  cols: [[0, 0, .48, 1, .9], [.52, 0, .48, .47, .28], [.52, .53, .48, .47, .28]],
  one:  [[0, 0, 1, .62, .9], [0, .69, .6, .31, .28]],
};
/* The switcher's geometry, shared by every look: one cell per desktop, rows shifted onto one column. */
function miniGeom(grid, cx, cy, s, o) {
  o = o || {};
  const CW = (o.cw || 46) * s, CH = (o.ch || 30) * s, GAP = (o.gap || 7) * s, PAD = (o.pad || 20) * s, TITLE = (o.title ?? 26) * s, rows = grid.m.rows;
  const pw = PAD * 2 + grid.colsE * (CW + GAP) - GAP, ph = PAD * 2 + rows.length * (CH + GAP) - GAP + TITLE;
  const x0 = cx - pw / 2, y0 = cy - ph / 2;
  return { CW, CH, GAP, PAD, TITLE, pw, ph, x0, y0, rows, X: c => x0 + PAD + c * (CW + GAP), Y: r => y0 + PAD + r * (CH + GAP) };
}

/* ---------- Draft D — Hardware: a laptop on a white page, a vivid dark desktop inside it ---------- */
const LIGHTS = ['#ff5f57', '#febc2e', '#28c840'];
const T = {
  accent: '#0a84ff', top: 22, bottom: 52, round: 1,
  font: '"Inter","IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif',
  fontFaces: [[500, '"Inter"'], [600, '"Inter"'], [500, '"IBM Plex Sans KR"'], [600, '"IBM Plex Sans KR"']],
  tints: {
    teal:   ['#021a2c', '#0b86ad', '#38d6f7'],
    amber:  ['#1c0420', '#b0287e', '#ff9ad5'],
    violet: ['#0f0630', '#6a3ad8', '#c4a2ff'],
    rose:   ['#2c0414', '#d32d68', '#ff92b6'],
    green:  ['#021f12', '#1c9a5e', '#6ae9ab'],
    slate:  ['#0b1020', '#3b5a8e', '#a0bdf0'],
  },
  /* Deep colour folded into broad bands, like the wallpapers shipped with the machine. */
  wall(g, w, h, t) {
    let gr = g.createLinearGradient(0, h, w, 0); gr.addColorStop(0, t[0]); gr.addColorStop(.7, t[1]); gr.addColorStop(1, t[2]); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    const band = (a, b, c, d, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(0, h * a); g.bezierCurveTo(w * .3, h * b, w * .55, h * c, w, h * d); g.lineTo(w, h); g.lineTo(0, h); g.closePath(); g.fill(); };
    band(.3, .05, .9, .55, rgba(t[0], .45)); band(.55, .35, 1.1, .8, rgba(t[0], .55)); band(.8, .62, 1.05, 1, black(.35));
    gr = g.createRadialGradient(w * .78, h * .2, 0, w * .78, h * .2, Math.max(w, h) * .45); gr.addColorStop(0, white(.22)); gr.addColorStop(1, white(0)); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  },
  window(g, win, w, h, u, t) {
    const top = 28 * u, p = 14 * u;
    g.save(); rr(g, 0, 0, w, h, 11 * u); g.clip();
    bar(g, 0, 0, w, h, '#1e1e22'); bar(g, 0, 0, w, top, '#2a2a2f'); line(g, 0, top, w, top, black(.5), 1);
    if (win.kind === 'side') bar(g, 0, top, w * .26, h - top, '#232328');
    LIGHTS.forEach((c, i) => dot(g, (14 + i * 15) * u, top / 2, 4.6 * u, c));
    txt(g, tr(win.label), w / 2, top / 2 + .5 * u, 11 * u, white(.8), 600, 'center');
    const cw = w - 2 * p, ch = h - top - 2 * p;
    BLOCKS[win.kind].forEach(b => { g.globalAlpha = b[4] > .5 ? .92 : .32; bar(g, p + b[0] * cw, top + p + b[1] * ch, b[2] * cw, b[3] * ch, t[2], 7 * u); });
    g.globalAlpha = 1; g.restore();
    ring(g, .5, .5, w - 1, h - 1, white(.16), 1, 11 * u);
  },
  shadow(g, u, dpr) { g.shadowColor = black(.55); g.shadowBlur = 40 * u * dpr; g.shadowOffsetY = 16 * u * dpr; },
  chrome(g, hero) {
    const { W, H, u } = hero, mb = 22 * u;
    bar(g, 0, 0, W, mb, black(.3));
    let x = 14 * u; [12, 30, 24, 34, 26].forEach((k, i) => { bar(g, x, mb / 2 - 3 * u, k * u, 6 * u, white(i < 2 ? .85 : .5), 3 * u); x += (k + 12) * u; });
    [10, 10, 40].forEach((k, i) => bar(g, W - (14 + [76, 58, 40][i]) * u, mb / 2 - 3 * u, k * u, 6 * u, white(.65), 3 * u));
    const icons = ['slate', 'teal', 'amber', 'violet', 'rose', 'green'], ic = 30 * u, gap = 8 * u, pad = 8 * u, dw = icons.length * (ic + gap) - gap + 2 * pad, dx = (W - dw) / 2, dy = H - 8 * u - ic - 2 * pad;
    rr(g, dx, dy, dw, ic + 2 * pad, 18 * u); frost(g, hero, 14 * u);
    bar(g, dx, dy, dw, ic + 2 * pad, 'rgba(40,40,46,.5)', 18 * u); ring(g, dx, dy, dw, ic + 2 * pad, white(.18), 1, 18 * u);
    const cur = hero.cell(hero.grid.cur).tint;
    icons.forEach((n, i) => {
      const ix = dx + pad + i * (ic + gap), gr = g.createLinearGradient(0, dy + pad, 0, dy + pad + ic); gr.addColorStop(0, TINT(n)[2]); gr.addColorStop(1, TINT(n)[1]);
      bar(g, ix, dy + pad, ic, ic, gr, 8 * u);
      if (n === cur) dot(g, ix + ic / 2, dy + ic + pad * 1.5, 1.8 * u, white(.75));
    });
  },
  /* Like the app switcher: a dark frosted slab, the chosen cell lifted in white. */
  mini(g, grid, cx, cy, s, alpha, hero) {
    const m = miniGeom(grid, cx, cy, s, { pad: 18, title: 28 }), { X, Y, CW, CH, GAP, PAD, pw, ph, x0, y0 } = m;
    g.save(); g.globalAlpha *= alpha;
    g.save(); g.shadowColor = black(.5); g.shadowBlur = 40 * s * hero.dpr; g.shadowOffsetY = 14 * s * hero.dpr; bar(g, x0, y0, pw, ph, '#26262b', 24 * s); g.restore();
    rr(g, x0, y0, pw, ph, 24 * s); frost(g, hero, 24 * s);
    bar(g, x0, y0, pw, ph, 'rgba(34,34,40,.64)', 24 * s); ring(g, x0 + .5, y0 + .5, pw - 1, ph - 1, white(.16), 1, 24 * s);
    g.save(); rr(g, x0 + 3 * s, y0, pw - 6 * s, ph, 22 * s); g.clip();
    bar(g, X(grid.leadE) - GAP / 2, y0 + PAD - GAP / 2, CW + GAP, m.rows.length * (CH + GAP), white(.04), 10 * s);

    [[0, 0], [0, 16.5], [4.3, 12.7], [7.1, 19], [9.7, 17.8], [6.9, 11.7], [12.2, 11.7]].forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath();
    g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 5 * this.dpr; g.shadowOffsetY = 1.5 * this.dpr; g.fillStyle = C.fill; g.fill(); g.shadowColor = 'transparent';
    g.strokeStyle = C.line; g.lineWidth = 1.1; g.lineJoin = 'round'; g.stroke(); g.restore(); g.restore();
  }
  draw() {
    const g = this.g, { W, H, dpr } = this;
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.globalAlpha = 1;
    g.drawImage(this.wallpaper(this.cell(this.grid.cur).tint), 0, 0, W, H);
    if (this.board.a < .995) {
      this.drawDesktop();
      if (this.grid.alpha > .01) T.mini(g, this.grid, W / 2, H / 2, this.u * (this.narrow ? .95 : 1.3), this.grid.alpha, this);
    }
    if (this.board.a > .005) { this.drawBoard(); this.drawCursor(); }
    this.drawMouse();
  }
}

/* ---------- wiring ---------- */
applyLang();
const hero = new Hero(document.getElementById('hero'));
const words = [...document.querySelectorAll('#line span')];
let beatTimer = 0;
hero.onBeat = i => { words.forEach((w, j) => w.classList.toggle('on', j === i)); if (T.onBeat) T.onBeat(i); clearTimeout(beatTimer); beatTimer = setTimeout(() => { words.forEach(w => w.classList.remove('on')); if (T.onBeat) T.onBeat(-1); }, 650); };

function redrawStill() { hero.seek(FREEZE); hero.draw(); }
/* Text on the canvases changes with the language and once the web font arrives. */
function repaint() { hero.sprites.clear(); if (STILL) redrawStill(); }

document.getElementById('lang').addEventListener('click', () => { lang = lang === 'ko' ? 'en' : 'ko'; try { localStorage.setItem('flick-lang', lang); } catch (e) {} applyLang(); repaint(); });
if (document.fonts) {
  const all = '워크스페이스편집기브라우저메모디자인채팅WorkspaceEditorBrowserNotesDesignChat123';
  Promise.all(T.fontFaces.map(([w, f]) => document.fonts.load(`${w} 12px ${f}`, all))).then(repaint, () => {});
}
new ResizeObserver(() => { hero.resize(); if (STILL) redrawStill(); else hero.draw(); }).observe(hero.cv);

/* Plays by itself, and only while it is on screen. */
if ('IntersectionObserver' in window) { hero.visible = false; new IntersectionObserver(es => { hero.visible = es[es.length - 1].isIntersecting; kick(); }, { threshold: .05 }).observe(hero.cv); }

let raf = 0, last = 0;
function frame(now) {
  raf = 0;
  const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
  if (!hero.visible || document.hidden) return;
  hero.step(dt); hero.draw(); raf = requestAnimationFrame(frame);
}
function kick() { if (STILL || raf || document.hidden || !hero.visible) return; last = performance.now(); raf = requestAnimationFrame(frame); }
document.addEventListener('visibilitychange', kick);
if (STILL) redrawStill(); else kick();
})();
</script>
