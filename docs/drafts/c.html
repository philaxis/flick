<style>
/* Draft C — Deep orbit: night sky in both schemes, a thin centred line, the demo as a lit porthole with an orbit drawn around it. */
:root{
  --bg:#020309; --bg2:#0b1236; --ink:#e9eeff; --mute:#8c94b0; --line:rgba(160,190,255,.14); --orbit:rgba(127,212,255,.2);
  --accent:#7fd4ff; --accent-ink:#8fdcff; --glow:rgba(90,160,255,.32); --star:rgba(255,255,255,.75);
  --font:"Space Grotesk","IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --gut:20px; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(130% 75% at 50% 0%,var(--bg2),var(--bg) 72%) var(--bg) no-repeat;color:var(--ink);font:400 16px/1.5 var(--font);padding-inline:var(--gut);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:absolute;inset:0 0 auto;height:110vh;z-index:-1;pointer-events:none;
  background:radial-gradient(1px 1px at 12% 18%,var(--star),transparent),radial-gradient(1px 1px at 28% 62%,var(--star),transparent),radial-gradient(1.5px 1.5px at 41% 9%,var(--star),transparent),radial-gradient(1px 1px at 63% 31%,var(--star),transparent),radial-gradient(1px 1px at 77% 12%,var(--star),transparent),radial-gradient(1.5px 1.5px at 88% 47%,var(--star),transparent),radial-gradient(1px 1px at 6% 81%,var(--star),transparent),radial-gradient(1px 1px at 93% 76%,var(--star),transparent),radial-gradient(1px 1px at 52% 88%,var(--star),transparent);opacity:.8}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:3px;border-radius:8px}
.col{width:min(1140px,100%,max(600px,(100svh - 330px)*16/9));margin-inline:auto}

.top{display:flex;align-items:center;justify-content:space-between;height:66px}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;font-size:18px;letter-spacing:.02em}
.brand img{width:26px;height:26px;display:block}
.top nav{display:flex;align-items:center;gap:24px;font-size:13px;font-weight:400;letter-spacing:.04em;color:var(--mute)}
.top nav a:hover,.top nav button:hover{color:var(--ink)}
.top nav button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:6px 0;cursor:pointer}

.say{display:flex;flex-direction:column;align-items:center;text-align:center;gap:28px;padding-block:40px 46px}
h1{margin:0;font-weight:300;letter-spacing:-.025em;line-height:1.08;font-size:clamp(36px,6vw,82px);text-wrap:balance}
:lang(en) h1{font-size:clamp(36px,5.4vw,74px)}
h1 span{transition:color .5s ease,text-shadow .5s ease}
h1 span.on{color:var(--accent-ink);text-shadow:0 0 28px var(--glow);transition-duration:.08s}
.dl{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 24px 0 20px;border-radius:999px;border:1px solid rgba(127,212,255,.55);background:rgba(127,212,255,.1);color:var(--ink);font-weight:500;font-size:16px;letter-spacing:.02em;white-space:nowrap;box-shadow:0 0 26px -4px var(--glow),inset 0 0 12px rgba(127,212,255,.12);transition:background .2s ease,box-shadow .2s ease}
.dl:hover{background:rgba(127,212,255,.2);box-shadow:0 0 34px 0 var(--glow)}
.dl svg{width:17px;height:17px;flex:none}

/* An orbit traced around the porthole, a horizon glowing beneath it. */
.orbit{position:relative}
.orbit::before{content:"";position:absolute;left:-7%;right:-7%;top:-14%;bottom:-14%;border:1px solid var(--orbit);border-radius:50%;transform:rotate(-7deg);pointer-events:none}
.orbit::after{content:"";position:absolute;left:8%;right:8%;bottom:-70px;height:140px;background:radial-gradient(50% 50% at 50% 0,var(--glow),transparent 75%);pointer-events:none;z-index:-1}
.stage{position:relative;aspect-ratio:16/9;border-radius:30px;overflow:hidden;background:#02030a;box-shadow:0 0 0 1px rgba(127,212,255,.3),0 0 0 8px rgba(127,212,255,.06),0 0 100px -14px var(--glow),0 50px 100px -50px rgba(0,0,0,.8)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.end{display:flex;flex-direction:column;align-items:center;margin-top:clamp(100px,14vw,190px);padding-top:30px}
.end .brand{font-size:clamp(34px,5vw,60px);font-weight:300;gap:18px;letter-spacing:.02em}
.end .brand img{width:clamp(44px,5.2vw,66px);height:auto}
footer{display:flex;justify-content:center;gap:8px;padding-block:40px 18px;font-size:13px;color:var(--mute)}
.inspiration{margin:0 auto;padding-bottom:44px;max-width:62ch;text-align:center;font-size:12px;line-height:1.7;color:var(--mute);opacity:.7}
.inspiration b{display:block;margin-bottom:4px;font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
footer a{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
footer a:hover{color:var(--ink)}

@media (max-width:820px){
  .say{padding-block:30px 40px;gap:24px}
  h1,:lang(en) h1{font-size:clamp(34px,10vw,60px)}
}
@media (max-width:640px){
  :root{--gut:16px}
  .col{width:100%}
  .top{height:58px}
  .hero{overflow-x:clip}
  .orbit::before{left:-4%;right:-4%;top:-12%;bottom:-12%}
  .stage{aspect-ratio:5/4;border-radius:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="col">
  <header class="top">
    <a class="brand" href="https://philaxis.github.io/flick/"><img src="../icon.png" alt="" width="28" height="28">Flick</a>
    <nav>
      <button type="button" id="lang" data-ko="English" data-en="한국어" data-ko-label="Switch to English" data-en-label="한국어로 보기">English</button>
      <a href="https://github.com/philaxis/flick">GitHub</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="say">
        <h1 id="line"><span data-ko="누르고," data-en="Hold.">누르고,</span> <span data-ko="밀면," data-en="Flick.">밀면,</span> <span data-ko="옆 데스크톱." data-en="Next desktop.">옆 데스크톱.</span></h1>
        <a class="dl" href="https://github.com/philaxis/flick/releases/latest/download/Flick.exe">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5v9M5 8l4 4 4-4M3 15.5h12"/></svg>
          <span data-ko="다운로드" data-en="Download">다운로드</span>
        </a>
      </div>

      <div class="orbit">
      <div class="stage" id="stage" role="img"
           data-ko-label="Flick 사용 화면: 마우스 옆 버튼을 누른 채 밀면 옆 데스크톱으로 넘어가고, 한 번 누르면 모든 창이 보입니다."
           data-en-label="Flick in use: hold the mouse side button and flick to land on the next desktop; tap it to see every window."
           aria-label="Flick 사용 화면">
        <canvas id="hero"></canvas>
      </div>
      </div>
    </section>

    <section class="end">
      <div class="brand"><img src="../icon.png" alt="" width="70" height="70">Flick</div>
    </section>
  </main>

  <footer>
    <span>MIT</span><span>·</span>
    <a href="https://github.com/philaxis/flick" data-ko="소스" data-en="source">소스</a><span>·</span>
    <span>made by <a href="https://philaxis.github.io">philaxis</a></span>
  </footer>
  <p class="inspiration"><b>Design inspiration</b><span data-ko="Flick의 아이디어는 단백질 접힘 현상에서 일부 영감을 받았습니다. 일렬로 연결된 아미노산들이 접히면서 복잡한 공간 구조를 형성한다는 점이 흥미로웠습니다. 그렇다면 가상 데스크톱도 꼭 일렬로 배치해야 할까요? 우리가 작업을 구분하고 연결하는 방식에 따라 공간적으로 배치할 수는 없을까요?" data-en="The idea for Flick was partly inspired by protein folding — how a linear chain of amino acids can fold into a complex spatial structure. It made me wonder: why should virtual desktops be confined to a single line? What if we could arrange them in a space that better reflects how we organize our work?">Flick의 아이디어는 단백질 접힘 현상에서 일부 영감을 받았습니다. 일렬로 연결된 아미노산들이 접히면서 복잡한 공간 구조를 형성한다는 점이 흥미로웠습니다. 그렇다면 가상 데스크톱도 꼭 일렬로 배치해야 할까요? 우리가 작업을 구분하고 연결하는 방식에 따라 공간적으로 배치할 수는 없을까요?</span></p>
</div>

<script>
(() => {
'use strict';
const qs = new URLSearchParams(location.search);
const FREEZE = qs.has('t') ? parseFloat(qs.get('t')) : null;   // ?t=3.6 holds one frame of the loop
// The loop is the page's content, like an embedded video, so it plays even
// where the system asks for reduced motion (Windows reports that whenever
// its animation effects are off, which left desktop visitors a still image).
const STILL = FREEZE !== null;

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const inOut = t => (t = clamp(t, 0, 1), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const follow = (cur, to, dt, tau) => to + (cur - to) * Math.exp(-dt / tau);
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
const white = a => `rgba(255,255,255,${a})`;
const black = a => `rgba(0,0,0,${a})`;

/* ---------- language ---------- */
let lang = 'ko';
try { lang = localStorage.getItem('flick-lang') || ''; } catch (e) { lang = ''; }
if (qs.get('lang')) lang = qs.get('lang');
if (lang !== 'ko' && lang !== 'en') lang = (navigator.languages || [navigator.language || 'ko']).some(l => /^ko/i.test(l)) ? 'ko' : 'en';
const tr = v => (v && typeof v === 'object') ? v[lang] : v;
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-ko]').forEach(el => { el.textContent = el.dataset[lang]; });
  document.querySelectorAll('[data-ko-label]').forEach(el => { el.setAttribute('aria-label', el.dataset[lang + 'Label']); });
}

/* ---------- drawing helpers ---------- */
let FONT = 'system-ui,sans-serif';
function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function bar(g, x, y, w, h, c, r) { g.fillStyle = c; if (r) { rr(g, x, y, w, h, r); g.fill(); } else g.fillRect(x, y, w, h); }
function ring(g, x, y, w, h, c, lw, r) { g.strokeStyle = c; g.lineWidth = lw; rr(g, x, y, w, h, r || 0); g.stroke(); }
function dot(g, x, y, r, c) { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
function line(g, x0, y0, x1, y1, c, lw) { g.strokeStyle = c; g.lineWidth = lw; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
function txt(g, s, x, y, px, c, weight, align) {
  g.font = `${weight || 400} ${px}px ${FONT}`; g.fillStyle = c; g.textAlign = align || 'left'; g.textBaseline = 'middle'; g.fillText(s, x, y);
}
/* A repeatable scatter, so a wallpaper looks the same every time it is painted. */
function seeded(seed) { let s = 0; for (const ch of String(seed)) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
/* Blurs what is already on the canvas behind a shape, for glass panels. */
function frost(g, hero, blur) {
  g.save(); g.clip(); g.filter = `blur(${blur}px)`;
  g.drawImage(hero.cv, 0, 0, hero.cv.width, hero.cv.height, 0, 0, hero.W, hero.H);
  g.restore();
}

/* Soft blocks inside a window, as fractions of its content box: x, y, w, h, strength. */
const BLOCKS = {
  side: [[0, 0, .22, 1, .28], [.25, 0, .75, .58, .9], [.25, .63, .36, .37, .28], [.64, .63, .36, .37, .28]],
  hero: [[0, 0, 1, .5, .9], [0, .56, .31, .44, .28], [.345, .56, .31, .44, .28], [.69, .56, .31, .44, .28]],
  list: [[0, 0, 1, .29, .9], [0, .355, 1, .29, .28], [0, .71, 1, .29, .28]],
  cols: [[0, 0, .48, 1, .9], [.52, 0, .48, .47, .28], [.52, .53, .48, .47, .28]],
  one:  [[0, 0, 1, .62, .9], [0, .69, .6, .31, .28]],
};
/* The switcher's geometry, shared by every look: one cell per desktop, rows shifted onto one column. */
function miniGeom(grid, cx, cy, s, o) {
  o = o || {};
  const CW = (o.cw || 46) * s, CH = (o.ch || 30) * s, GAP = (o.gap || 7) * s, PAD = (o.pad || 20) * s, TITLE = (o.title ?? 26) * s, rows = grid.m.rows;
  const pw = PAD * 2 + grid.colsE * (CW + GAP) - GAP, ph = PAD * 2 + rows.length * (CH + GAP) - GAP + TITLE;
  const x0 = cx - pw / 2, y0 = cy - ph / 2;
  return { CW, CH, GAP, PAD, TITLE, pw, ph, x0, y0, rows, X: c => x0 + PAD + c * (CW + GAP), Y: r => y0 + PAD + r * (CH + GAP) };
}

/* ---------- Draft C — Deep orbit: starfield desktops under a planet's rim, dark glass windows, the switcher as orbits ---------- */
const T = {
  accent: '#7fd4ff', top: 0, bottom: 22, round: 1.3,
  font: '"Space Grotesk","IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif',
  fontFaces: [[500, '"Space Grotesk"'], [600, '"Space Grotesk"'], [500, '"IBM Plex Sans KR"'], [600, '"IBM Plex Sans KR"']],
  tints: {
    teal:   ['#01050c', '#0b3a48', '#4fd8cc'],
    amber:  ['#01030c', '#123a7a', '#7fc4ff'],
    violet: ['#04020e', '#2f1b62', '#ac90ff'],
    rose:   ['#08020c', '#4a1438', '#f78bba'],
    green:  ['#010806', '#103c2a', '#6fdc9a'],
    slate:  ['#02040b', '#1a2645', '#93a8da'],
  },
  wall(g, w, h, t, u, name) {
    const rnd = seeded(name);
    bar(g, 0, 0, w, h, t[0]);
    const nx = w * (.2 + rnd() * .5), ny = h * (.15 + rnd() * .35);
    let gr = g.createRadialGradient(nx, ny, 0, nx, ny, Math.max(w, h) * .62); gr.addColorStop(0, rgba(t[1], .95)); gr.addColorStop(.55, rgba(t[1], .28)); gr.addColorStop(1, rgba(t[1], 0)); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    gr = g.createRadialGradient(nx + w * .12, ny + h * .1, 0, nx + w * .12, ny + h * .1, Math.max(w, h) * .25); gr.addColorStop(0, rgba(t[2], .14)); gr.addColorStop(1, rgba(t[2], 0)); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    const n = Math.round(w * h / 2600);
    for (let i = 0; i < n; i++) dot(g, rnd() * w, rnd() * h, (.25 + Math.pow(rnd(), 4) * 1.2) * u, white(.25 + rnd() * .6));
    g.save(); g.shadowColor = white(.9); g.shadowBlur = 6 * u;
    for (let i = 0; i < 7; i++) dot(g, rnd() * w, rnd() * h * .7, 1.3 * u, '#fff');
    g.restore();
    /* the rim of a planet low on the right, lit from behind */
    const R = h * 1.05, px = w * .86, py = h + R * .78;
    gr = g.createRadialGradient(px, py, R * .96, px, py, R * 1.12); gr.addColorStop(0, rgba(t[2], .35)); gr.addColorStop(1, rgba(t[2], 0)); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    dot(g, px, py, R, '#010207');
    g.save(); g.shadowColor = t[2]; g.shadowBlur = 10 * u; g.strokeStyle = rgba(t[2], .8); g.lineWidth = 1.2 * u; g.beginPath(); g.arc(px, py, R, Math.PI * 1.02, Math.PI * 1.98); g.stroke(); g.restore();
  },
  window(g, win, w, h, u, t) {
    const top = 28 * u, p = 14 * u, r = 14 * u;
    g.save(); rr(g, 0, 0, w, h, r); g.clip();
    let gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, 'rgba(24,30,52,.9)'); gr.addColorStop(1, 'rgba(9,12,24,.94)'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    gr = g.createLinearGradient(0, 0, w, 0); gr.addColorStop(0, white(0)); gr.addColorStop(.5, white(.35)); gr.addColorStop(1, white(0)); bar(g, 0, 0, w, 1, gr);
    for (let i = 0; i < 3; i++) { g.strokeStyle = white(.3); g.lineWidth = 1; g.beginPath(); g.arc((16 + i * 13) * u, top / 2, 3.6 * u, 0, 7); g.stroke(); }
    txt(g, tr(win.label), 58 * u, top / 2 + .5 * u, 11 * u, white(.72), 500);
    const cw = w - 2 * p, ch = h - top - p;
    BLOCKS[win.kind].forEach(b => {
      const by = top + b[1] * ch, bh = b[3] * ch - p * .4, gr = g.createLinearGradient(0, by, 0, by + bh);
      gr.addColorStop(0, rgba(t[2], b[4] > .5 ? .55 : .16)); gr.addColorStop(1, rgba(t[2], b[4] > .5 ? .12 : .05));
      bar(g, p + b[0] * cw, by, b[2] * cw, bh, gr, 9 * u);
      if (b[4] > .5) ring(g, p + b[0] * cw + .5, by + .5, b[2] * cw - 1, bh - 1, rgba(t[2], .45), 1, 9 * u);
    });
    g.restore();
    ring(g, .5, .5, w - 1, h - 1, white(.14), 1, r);
  },
  shadow(g, u, dpr, t) { g.shadowColor = rgba(t[2], .22); g.shadowBlur = 40 * u * dpr; g.shadowOffsetY = 10 * u * dpr; },
  shadowFill: '#000',
  /* No taskbar: the desktops of this row as a line of stars, the current one lit. */
  chrome(g, hero) {
    const { W, H, u } = hero, row = hero.grid.m.rows[hero.grid.cur.r].cells, n = row.length, y = H - 12 * u, x0 = W / 2 - (n - 1) * 9 * u;
    line(g, x0 - 10 * u, y, x0 + (n - 1) * 18 * u + 10 * u, y, white(.14), 1);
    row.forEach((_, i) => { if (i === hero.grid.cur.c) { g.save(); g.shadowColor = ACCENT; g.shadowBlur = 8 * u * hero.dpr; dot(g, x0 + i * 18 * u, y, 3 * u, ACCENT); g.restore(); } else dot(g, x0 + i * 18 * u, y, 2 * u, white(.45)); });
  },
  /* The switcher as orbits: each row a track, each desktop a body on it, the current one ringed. */
  mini(g, grid, cx, cy, s, alpha, hero) {

  /* The cursor exists only on the board, where it picks a window up and carries it. */
  drawCursor() {
    const g = this.g, u = this.u, x = this.cur.x * this.W, y = this.cur.y * this.H, k = (this.narrow ? 1.25 : 1.12) * u, C = T.cursor || { fill: '#fff', line: '#111' };
    g.save(); g.globalAlpha = this.board.a;
    if (this.grip > .05) { g.strokeStyle = rgba(C.ringHex || '#ffffff', .55 * this.grip); g.lineWidth = 1.5 * u; g.beginPath(); g.arc(x, y, 9 * u, 0, 7); g.stroke(); }
    g.save(); g.translate(x, y); g.scale(k, k); g.beginPath();
    [[0, 0], [0, 16.5], [4.3, 12.7], [7.1, 19], [9.7, 17.8], [6.9, 11.7], [12.2, 11.7]].forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath();
    g.shadowColor = 'rgba(0,0,0,.45)'; g.shadowBlur = 5 * this.dpr; g.shadowOffsetY = 1.5 * this.dpr; g.fillStyle = C.fill; g.fill(); g.shadowColor = 'transparent';
    g.strokeStyle = C.line; g.lineWidth = 1.1; g.lineJoin = 'round'; g.stroke(); g.restore(); g.restore();
  }
  draw() {
    const g = this.g, { W, H, dpr } = this;
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.globalAlpha = 1;
    g.drawImage(this.wallpaper(this.cell(this.grid.cur).tint), 0, 0, W, H);
    if (this.board.a < .995) {
      this.drawDesktop();
      if (this.grid.alpha > .01) T.mini(g, this.grid, W / 2, H / 2, this.u * (this.narrow ? .95 : 1.3), this.grid.alpha, this);
    }
    if (this.board.a > .005) { this.drawBoard(); this.drawCursor(); }
    this.drawMouse();
  }
}

/* ---------- wiring ---------- */
applyLang();
const hero = new Hero(document.getElementById('hero'));
const words = [...document.querySelectorAll('#line span')];
let beatTimer = 0;
hero.onBeat = i => { words.forEach((w, j) => w.classList.toggle('on', j === i)); if (T.onBeat) T.onBeat(i); clearTimeout(beatTimer); beatTimer = setTimeout(() => { words.forEach(w => w.classList.remove('on')); if (T.onBeat) T.onBeat(-1); }, 650); };

function redrawStill() { hero.seek(FREEZE); hero.draw(); }
/* Text on the canvases changes with the language and once the web font arrives. */
function repaint() { hero.sprites.clear(); if (STILL) redrawStill(); }

document.getElementById('lang').addEventListener('click', () => { lang = lang === 'ko' ? 'en' : 'ko'; try { localStorage.setItem('flick-lang', lang); } catch (e) {} applyLang(); repaint(); });
if (document.fonts) {
  const all = '워크스페이스편집기브라우저메모디자인채팅WorkspaceEditorBrowserNotesDesignChat123';
  Promise.all(T.fontFaces.map(([w, f]) => document.fonts.load(`${w} 12px ${f}`, all))).then(repaint, () => {});
}
new ResizeObserver(() => { hero.resize(); if (STILL) redrawStill(); else hero.draw(); }).observe(hero.cv);

/* Plays by itself, and only while it is on screen. */
if ('IntersectionObserver' in window) { hero.visible = false; new IntersectionObserver(es => { hero.visible = es[es.length - 1].isIntersecting; kick(); }, { threshold: .05 }).observe(hero.cv); }

let raf = 0, last = 0;
function frame(now) {
  raf = 0;
  const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
  if (!hero.visible || document.hidden) return;
  hero.step(dt); hero.draw(); raf = requestAnimationFrame(frame);
}
function kick() { if (STILL || raf || document.hidden || !hero.visible) return; last = performance.now(); raf = requestAnimationFrame(frame); }
document.addEventListener('visibilitychange', kick);
if (STILL) redrawStill(); else kick();
})();
</script>
