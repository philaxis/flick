<style>
/* Draft B — Flight deck: graph paper, monospaced type, the demo bolted into an instrument panel. */
:root{
  --bg:#e7e9e3; --ink:#141a17; --mute:#56615a; --line:rgba(20,26,23,.18); --grid:rgba(20,26,23,.06);
  --accent:#ffb000; --accent-ink:#a86a00; --green:#2a8c58;
  --mono:"IBM Plex Mono","IBM Plex Sans KR","Malgun Gothic",ui-monospace,monospace;
  --font:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --gut:20px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#090c0b; --ink:#dfe9e3; --mute:#7c8a82; --line:rgba(120,255,190,.16); --grid:rgba(120,255,190,.045); --accent-ink:#ffb000; --green:#5cf2a0; color-scheme:dark}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px;color:var(--ink);font:400 15px/1.5 var(--font);padding-inline:var(--gut);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.col{width:min(1360px,100%);margin-inline:auto}

.top{display:flex;align-items:center;justify-content:space-between;height:56px;border-bottom:1px solid var(--line);font-family:var(--mono)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;letter-spacing:.14em;text-transform:uppercase}
.brand img{width:24px;height:24px;display:block}
.top nav{display:flex;align-items:center;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.top nav a,.top nav button{padding:6px 14px;border-left:1px solid var(--line)}
.top nav a:hover,.top nav button:hover{color:var(--ink)}
.top nav button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;background:none;border-block:0;border-right:0;cursor:pointer}

/* Wide screens: the line stacked in a narrow column at left, the panel at right. */
.hero{display:grid;grid-template-columns:minmax(240px,27%) 1fr;gap:36px;align-items:end;padding-top:34px}
.say{display:flex;flex-direction:column;align-items:flex-start;gap:30px;padding-bottom:30px}
.say::before{content:"";display:block;width:120px;height:9px;background:linear-gradient(90deg,var(--green) 1px,transparent 1px) 0 0/10px 5px repeat-x,linear-gradient(90deg,var(--green) 1px,transparent 1px) 0 0/50px 9px repeat-x;opacity:.8}
h1{margin:0;font-family:var(--mono);font-weight:600;letter-spacing:-.03em;line-height:1.08;font-size:clamp(34px,3.7vw,56px)}
h1 span{display:block;transition:color .5s ease}
h1 span::before{content:"";display:inline-block;width:.28em;height:.28em;margin:0 .3em .18em 0;border:1.5px solid var(--line);vertical-align:middle;transition:background .5s ease,border-color .5s ease}
h1 span.on{color:var(--accent-ink);transition-duration:.08s}
h1 span.on::before{background:var(--accent);border-color:var(--accent);transition-duration:.08s}
.dl{display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 22px 0 18px;border-radius:3px;background:var(--accent);color:#1b1200;font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);transition:filter .15s ease}
.dl:hover{filter:brightness(1.08)}
.dl svg{width:18px;height:18px;flex:none}

/* The panel: gunmetal, four screws, rulers on two edges, three lamps that follow the line. */
.panel{position:relative;padding:24px;border-radius:8px;background:linear-gradient(160deg,#30363a,#1b1f21 60%,#15181a);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 0 0 1px rgba(0,0,0,.6),0 30px 60px -32px rgba(0,0,0,.7)}
.screw{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8a9196,#2b3033 70%);box-shadow:0 1px 0 rgba(255,255,255,.08)}
.screw::after{content:"";position:absolute;left:1px;right:1px;top:4px;height:1px;background:rgba(0,0,0,.55);transform:rotate(-30deg)}
.screw:nth-of-type(1){left:8px;top:8px}.screw:nth-of-type(2){right:8px;top:8px}.screw:nth-of-type(3){left:8px;bottom:8px}.screw:nth-of-type(4){right:8px;bottom:8px}
.ruler{position:absolute;opacity:.7}
.ruler.x{left:34px;right:34px;top:8px;height:9px;background:linear-gradient(90deg,#5cf2a0 1px,transparent 1px) 0 100%/10px 4px repeat-x,linear-gradient(90deg,#5cf2a0 1px,transparent 1px) 0 100%/50px 9px repeat-x}
.ruler.y{top:34px;bottom:34px;left:8px;width:9px;background:linear-gradient(#5cf2a0 1px,transparent 1px) 100% 0/4px 10px repeat-y,linear-gradient(#5cf2a0 1px,transparent 1px) 100% 0/9px 50px repeat-y}
.lamps{position:absolute;right:34px;bottom:8px;display:flex;gap:10px}
.lamps i{width:7px;height:7px;border-radius:50%;background:#3b2c08;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5);transition:background .4s ease,box-shadow .4s ease}
.lamps i.on{background:#ffb000;box-shadow:0 0 10px #ffb000;transition-duration:.06s}
.stage{position:relative;aspect-ratio:16/9;border-radius:3px;overflow:hidden;background:#030806;box-shadow:0 0 0 1px rgba(92,242,160,.28),0 0 0 4px #0b0e0d,0 0 30px rgba(92,242,160,.1)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.end{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:clamp(80px,12vw,160px);padding-top:28px;border-top:1px dashed var(--line);font-family:var(--mono)}
.end .brand{font-size:clamp(30px,4.4vw,56px);gap:18px;letter-spacing:.12em}
.end .brand img{width:clamp(40px,4.8vw,62px);height:auto}
footer{display:flex;gap:8px;padding-block:40px 22px;font-family:var(--mono);font-size:12px;color:var(--mute)}
.inspiration{margin:0;padding-bottom:40px;max-width:68ch;font-size:12px;line-height:1.7;color:var(--mute);opacity:.7}
.inspiration b{display:block;margin-bottom:3px;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
footer a{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
footer a:hover{color:var(--ink)}

@media (max-width:980px){
  .hero{grid-template-columns:1fr;gap:0;padding-top:26px}
  .say{flex-direction:row;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px 24px;padding-bottom:24px}
  .say::before{flex-basis:100%}
  h1{font-size:clamp(30px,7vw,52px)}
}
@media (max-width:640px){
  :root{--gut:14px}
  .top{height:52px}
  .top nav a,.top nav button{padding:6px 10px}
  .say{flex-direction:column;align-items:flex-start}
  h1{font-size:clamp(30px,9.4vw,46px)}
  .panel{padding:16px 14px 20px 16px}
  .screw{width:7px;height:7px}
  .ruler.x{left:24px;right:24px;top:4px}
  .ruler.y{top:24px;bottom:24px;left:3px}
  .lamps{right:24px;bottom:6px}
  .stage{aspect-ratio:5/4}
  .end{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="col">
  <header class="top">
    <a class="brand" href="https://philaxis.github.io/flick/"><img src="../icon.png" alt="" width="28" height="28">Flick</a>
    <nav>
      <button type="button" id="lang" data-ko="English" data-en="한국어" data-ko-label="Switch to English" data-en-label="한국어로 보기">English</button>

  <main>
    <section class="hero">

        <a class="dl" href="https://github.com/philaxis/flick/releases/latest/download/Flick.exe">

      <div class="panel"><b class="screw"></b><b class="screw"></b><b class="screw"></b><b class="screw"></b><span class="ruler x"></span><span class="ruler y"></span>
      <div class="stage" id="stage" role="img"
           data-ko-label="Flick 사용 화면: 마우스 옆 버튼을 누른 채 밀면 옆 데스크톱으로 넘어가고, 한 번 누르면 모든 창이 보입니다."
           data-en-label="Flick in use: hold the mouse side button and flick to land on the next desktop; tap it to see every window."
           aria-label="Flick 사용 화면">
        <canvas id="hero"></canvas>

    <section class="end">

  <footer>
    <span>MIT</span><span>·</span>
    <a href="https://github.com/philaxis/flick" data-ko="소스" data-en="source">소스</a><span>·</span>
    <span>made by <a href="https://philaxis.github.io">philaxis</a></span>
  </footer>
  <p class="inspiration"><b>Design inspiration</b><span data-ko="Flick의 아이디어는 단백질 접힘 현상에서 일부 영감을 받았습니다. 일렬로 연결된 아미노산들이 접히면서 복잡한 공간 구조를 형성한다는 점이 흥미로웠습니다. 그렇다면 가상 데스크톱도 꼭 일렬로 배치해야 할까요? 우리가 작업을 구분하고 연결하는 방식에 따라 공간적으로 배치할 수는 없을까요?" data-en="The idea for Flick was partly inspired by protein folding — how a linear chain of amino acids can fold into a complex spatial structure. It made me wonder: why should virtual desktops be confined to a single line? What if we could arrange them in a space that better reflects how we organize our work?">Flick의 아이디어는 단백질 접힘 현상에서 일부 영감을 받았습니다. 일렬로 연결된 아미노산들이 접히면서 복잡한 공간 구조를 형성한다는 점이 흥미로웠습니다. 그렇다면 가상 데스크톱도 꼭 일렬로 배치해야 할까요? 우리가 작업을 구분하고 연결하는 방식에 따라 공간적으로 배치할 수는 없을까요?</span></p>
</div>

<script>
(() => {
'use strict';
const qs = new URLSearchParams(location.search);
const FREEZE = qs.has('t') ? parseFloat(qs.get('t')) : null;   // ?t=3.6 holds one frame of the loop
// The loop is the page's content, like an embedded video, so it plays even
// where the system asks for reduced motion (Windows reports that whenever
// its animation effects are off, which left desktop visitors a still image).
const STILL = FREEZE !== null;

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const inOut = t => (t = clamp(t, 0, 1), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const follow = (cur, to, dt, tau) => to + (cur - to) * Math.exp(-dt / tau);
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
const white = a => `rgba(255,255,255,${a})`;
const black = a => `rgba(0,0,0,${a})`;

/* ---------- language ---------- */
let lang = 'ko';
try { lang = localStorage.getItem('flick-lang') || ''; } catch (e) { lang = ''; }
if (qs.get('lang')) lang = qs.get('lang');
if (lang !== 'ko' && lang !== 'en') lang = (navigator.languages || [navigator.language || 'ko']).some(l => /^ko/i.test(l)) ? 'ko' : 'en';
const tr = v => (v && typeof v === 'object') ? v[lang] : v;
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-ko]').forEach(el => { el.textContent = el.dataset[lang]; });
  document.querySelectorAll('[data-ko-label]').forEach(el => { el.setAttribute('aria-label', el.dataset[lang + 'Label']); });
}

/* ---------- drawing helpers ---------- */
let FONT = 'system-ui,sans-serif';
function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function bar(g, x, y, w, h, c, r) { g.fillStyle = c; if (r) { rr(g, x, y, w, h, r); g.fill(); } else g.fillRect(x, y, w, h); }
function ring(g, x, y, w, h, c, lw, r) { g.strokeStyle = c; g.lineWidth = lw; rr(g, x, y, w, h, r || 0); g.stroke(); }
function dot(g, x, y, r, c) { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
function line(g, x0, y0, x1, y1, c, lw) { g.strokeStyle = c; g.lineWidth = lw; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
function txt(g, s, x, y, px, c, weight, align) {
  g.font = `${weight || 400} ${px}px ${FONT}`; g.fillStyle = c; g.textAlign = align || 'left'; g.textBaseline = 'middle'; g.fillText(s, x, y);
}
/* A repeatable scatter, so a wallpaper looks the same every time it is painted. */
function seeded(seed) { let s = 0; for (const ch of String(seed)) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
/* Blurs what is already on the canvas behind a shape, for glass panels. */
function frost(g, hero, blur) {
  g.save(); g.clip(); g.filter = `blur(${blur}px)`;
  g.drawImage(hero.cv, 0, 0, hero.cv.width, hero.cv.height, 0, 0, hero.W, hero.H);
  g.restore();
}

/* Soft blocks inside a window, as fractions of its content box: x, y, w, h, strength. */
const BLOCKS = {
  side: [[0, 0, .22, 1, .28], [.25, 0, .75, .58, .9], [.25, .63, .36, .37, .28], [.64, .63, .36, .37, .28]],
  hero: [[0, 0, 1, .5, .9], [0, .56, .31, .44, .28], [.345, .56, .31, .44, .28], [.69, .56, .31, .44, .28]],
  list: [[0, 0, 1, .29, .9], [0, .355, 1, .29, .28], [0, .71, 1, .29, .28]],
  cols: [[0, 0, .48, 1, .9], [.52, 0, .48, .47, .28], [.52, .53, .48, .47, .28]],
  one:  [[0, 0, 1, .62, .9], [0, .69, .6, .31, .28]],
};
/* The switcher's geometry, shared by every look: one cell per desktop, rows shifted onto one column. */
function miniGeom(grid, cx, cy, s, o) {
  o = o || {};
  const CW = (o.cw || 46) * s, CH = (o.ch || 30) * s, GAP = (o.gap || 7) * s, PAD = (o.pad || 20) * s, TITLE = (o.title ?? 26) * s, rows = grid.m.rows;
  const pw = PAD * 2 + grid.colsE * (CW + GAP) - GAP, ph = PAD * 2 + rows.length * (CH + GAP) - GAP + TITLE;
  const x0 = cx - pw / 2, y0 = cy - ph / 2;
  return { CW, CH, GAP, PAD, TITLE, pw, ph, x0, y0, rows, X: c => x0 + PAD + c * (CW + GAP), Y: r => y0 + PAD + r * (CH + GAP) };
}

/* ---------- Draft B — Flight deck: a phosphor display, line-drawn windows, the switcher as a gauge ---------- */
const PH = '#5cf2a0';   // phosphor green; amber is the accent
const T = {
  accent: '#ffb000', top: 16, bottom: 22, round: .22,
  font: '"IBM Plex Mono","IBM Plex Sans KR","Malgun Gothic",ui-monospace,monospace',
  fontFaces: [[500, '"IBM Plex Mono"'], [600, '"IBM Plex Mono"'], [500, '"IBM Plex Sans KR"'], [600, '"IBM Plex Sans KR"']],
  tints: {
    teal:   ['#030d0b', '#06201a', '#5cf2c8'],
    amber:  ['#030d07', '#08241a', '#5cf2a0'],
    violet: ['#08060f', '#151028', '#a99bff'],
    rose:   ['#0e0507', '#260d13', '#ff7d93'],
    green:  ['#040d05', '#0a220d', '#86ff8f'],
    slate:  ['#05080c', '#0f1824', '#9fb7d0'],
  },
  /* A display, not a photo: fine graticule, a horizon line, darker towards the edges. */
  wall(g, w, h, t, u) {
    bar(g, 0, 0, w, h, t[0]);
    let gr = g.createRadialGradient(w / 2, h * .48, 0, w / 2, h * .48, Math.max(w, h) * .6); gr.addColorStop(0, t[1]); gr.addColorStop(1, rgba(t[1], 0)); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    const step = 20 * u;
    for (let x = w / 2 % step, i = 0; x < w; x += step, i++) line(g, x, 0, x, h, rgba(t[2], Math.round((x - w / 2) / step) % 5 ? .045 : .1), 1);
    for (let y = h / 2 % step; y < h; y += step) line(g, 0, y, w, y, rgba(t[2], Math.round((y - h / 2) / step) % 5 ? .045 : .1), 1);
    line(g, w * .08, h / 2, w * .92, h / 2, rgba(t[2], .18), 1);
    [-2, -1, 1, 2].forEach(k => line(g, w / 2 - (k % 2 ? 18 : 30) * u, h / 2 + k * 26 * u, w / 2 + (k % 2 ? 18 : 30) * u, h / 2 + k * 26 * u, rgba(t[2], .14), 1));
    gr = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * .35, w / 2, h / 2, Math.max(w, h) * .75); gr.addColorStop(0, black(0)); gr.addColorStop(1, black(.55)); g.fillStyle = gr; g.fillRect(0, 0, w, h);
  },
  window(g, win, w, h, u, t) {
    const top = 22 * u, p = 12 * u, c = t[2];
    bar(g, 0, 0, w, h, 'rgba(2,8,6,.94)', 3 * u);
    bar(g, 1, 1, w - 2, top, rgba(c, .1));
    line(g, 0, top, w, top, rgba(c, .4), 1);
    txt(g, tr(win.label).toUpperCase(), 10 * u, top / 2 + .5 * u, 10 * u, c, 600);
    for (let i = 0; i < 3; i++) ring(g, w - (18 + i * 12) * u, top / 2 - 3 * u, 6 * u, 6 * u, rgba(c, .55), 1);

/* ---------- wiring ---------- */

const words = [...document.querySelectorAll('#line span')];
let beatTimer = 0;

  const all = '워크스페이스편집기브라우저메모디자인채팅WorkspaceEditorBrowserNotesDesignChat123';
  Promise.all(T.fontFaces.map(([w, f]) => document.fonts.load(`${w} 12px ${f}`, all))).then(repaint, () => {});
}
new ResizeObserver(() => { hero.resize(); if (STILL) redrawStill(); else hero.draw(); }).observe(hero.cv);

function frame(now) {
  raf = 0;
  const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
  if (!hero.visible || document.hidden) return;
  hero.step(dt); hero.draw(); raf = requestAnimationFrame(frame);
}
function kick() { if (STILL || raf || document.hidden || !hero.visible) return; last = performance.now(); raf = requestAnimationFrame(frame); }
document.addEventListener('visibilitychange', kick);
if (STILL) redrawStill(); else kick();
})();
