<head>

<style>
/* Draft A — Aqua: a pastel wash, the demo set inside a real-looking macOS window. */
:root{
  --bg:#eef0f8; --ink:#1d1d1f; --mute:#6e6e73; --line:rgba(0,0,0,.1);
  --accent:#0a84ff; --accent-ink:#0066cc;
  --wash:radial-gradient(70% 55% at 0% 0%,#cfe0ff 0,transparent 62%),radial-gradient(55% 55% at 100% 8%,#f1d8ff 0,transparent 62%),radial-gradient(70% 60% at 60% 100%,#ffe0cf 0,transparent 62%);
  --glass:rgba(255,255,255,.62); --glass-edge:rgba(255,255,255,.85); --bar:rgba(246,246,249,.86); --edge:rgba(0,0,0,.14);
  --stage-shadow:0 40px 90px -36px rgba(48,62,130,.5);
  --font:"Inter","IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --gut:20px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1020; --ink:#f5f5f7; --mute:#a1a1a8; --line:rgba(255,255,255,.12); --accent-ink:#5aaeff;
    --wash:radial-gradient(70% 55% at 0% 0%,rgba(60,90,200,.45) 0,transparent 62%),radial-gradient(55% 55% at 100% 8%,rgba(150,80,200,.35) 0,transparent 62%),radial-gradient(70% 60% at 60% 100%,rgba(200,100,90,.22) 0,transparent 62%);
    --glass:rgba(40,42,58,.5); --glass-edge:rgba(255,255,255,.1); --bar:rgba(46,46,54,.86); --edge:rgba(255,255,255,.14);
    --stage-shadow:0 40px 90px -36px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font);padding-inline:var(--gut);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--wash);pointer-events:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:3px;border-radius:8px}
.col{width:min(1180px,100%,max(600px,(100svh - 300px)*16/9));margin-inline:auto}

.top{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:18px;letter-spacing:-.015em}
.brand img{width:26px;height:26px;display:block}
.top nav{display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-edge);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);font-size:13px;font-weight:500}
.top nav a,.top nav button{padding:6px 14px;border-radius:999px;color:var(--mute);transition:background .2s ease,color .2s ease}
.top nav a:hover,.top nav button:hover{color:var(--ink);background:var(--line)}
.top nav button{font:inherit;background:none;border:0;cursor:pointer}

.say{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;padding-block:44px 32px}
h1{margin:0;font-weight:700;letter-spacing:-.04em;line-height:1.04;font-size:clamp(34px,5.4vw,72px);text-wrap:balance}
:lang(en) h1{font-size:clamp(34px,4.6vw,62px)}
h1 span{transition:color .5s ease}
h1 span.on{color:var(--accent-ink);transition-duration:.08s}
.say .dl{flex:none;margin-bottom:6px}
.dl{display:inline-flex;align-items:center;gap:9px;height:46px;padding:0 22px 0 18px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;font-size:16px;white-space:nowrap;box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 10px 24px -10px rgba(10,132,255,.8);transition:transform .15s ease,filter .15s ease}
.dl:hover{filter:brightness(1.07);transform:translateY(-1px)}
.dl:active{transform:translateY(0)}
.dl svg{width:17px;height:17px;flex:none}

/* The stage is a window: title bar, traffic lights, a hairline edge. */
.win{border-radius:14px;overflow:hidden;background:var(--bar);box-shadow:0 0 0 .5px var(--edge),0 1px 0 rgba(255,255,255,.5) inset,var(--stage-shadow);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%)}
.win-bar{position:relative;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-bottom:1px solid var(--edge);font-size:13px;font-weight:600;color:var(--mute)}
.win-bar i{width:12px;height:12px;border-radius:50%;background:#ff5f57;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.win-bar i:nth-child(2){background:#febc2e}.win-bar i:nth-child(3){background:#28c840}
.win-bar span{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:#dfe6f3}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

.end{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:clamp(80px,12vw,160px);padding:30px 34px;border-radius:24px;background:var(--glass);border:1px solid var(--glass-edge);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%)}
.end .brand{font-size:clamp(34px,5vw,60px);font-weight:700;gap:18px;letter-spacing:-.035em}
.end .brand img{width:clamp(44px,5.2vw,66px);height:auto}
footer{display:flex;gap:8px;padding:34px 4px 20px;font-size:13px;color:var(--mute)}
.inspiration{margin:0;padding:0 4px 44px;max-width:68ch;font-size:12px;line-height:1.65;color:var(--mute);opacity:.7}
.inspiration b{display:block;margin-bottom:3px;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
footer a{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
footer a:hover{color:var(--ink)}

@media (max-width:820px){
  .say{flex-direction:column;align-items:flex-start;gap:22px;padding-block:28px 26px}
  h1,:lang(en) h1{font-size:clamp(34px,10.4vw,60px)}
}
@media (max-width:640px){
  :root{--gut:14px}
  .col{width:100%}
  .top{height:58px}
  .win{border-radius:12px}
  .win-bar{height:30px;gap:6px;padding:0 11px;font-size:12px}
  .win-bar i{width:10px;height:10px}
  .stage{aspect-ratio:5/4}
  .end{flex-direction:column;align-items:flex-start;padding:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="col">
  <header class="top">
    <a class="brand" href="https://philaxis.github.io/flick/"><img src="../icon.png" alt="" width="28" height="28">Flick</a>
    <nav>
      <button type="button" id="lang" data-ko="English" data-en="한국어" data-ko-label="Switch to English" data-en-label="한국어로 보기">English</button>
      <a href="https://github.com/philaxis/flick">GitHub</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="say">
        <h1 id="line"><span data-ko="누르고," data-en="Hold.">누르고,</span> <span data-ko="밀면," data-en="Flick.">밀면,</span> <span data-ko="옆 데스크톱." data-en="Next desktop.">옆 데스크톱.</span></h1>
        <a class="dl" href="https://github.com/philaxis/flick/releases/latest/download/Flick.exe">
          <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5v9M5 8l4 4 4-4M3 15.5h12"/></svg>
          <span data-ko="다운로드" data-en="Download">다운로드</span>
        </a>
      </div>

      <div class="win"><div class="win-bar" aria-hidden="true"><i></i><i></i><i></i><span>Flick</span></div>
      <div class="stage" id="stage" role="img"
           data-ko-label="Flick 사용 화면: 마우스 옆 버튼을 누른 채 밀면 옆 데스크톱으로 넘어가고, 한 번 누르면 모든 창이 보입니다."
           data-en-label="Flick in use: hold the mouse side button and flick to land on the next desktop; tap it to see every window."
           aria-label="Flick 사용 화면">
        <canvas id="hero"></canvas>
      </div>
      </div>
    </section>

    <section class="end">
      <div class="brand"><img src="../icon.png" alt="" width="70" height="70">Flick</div>
    </section>
  </main>

  <footer>
    <span>MIT</span><span>·</span>
    <a href="https://github.com/philaxis/flick" data-ko="소스" data-en="source">소스</a><span>·</span>
    <span>made by <a href="https://philaxis.github.io">philaxis</a></span>
  </footer>
  <p class="inspiration"><b>Design inspiration</b><span data-ko="Flick의 아이디어는 단백질 접힘 현상에서 일부 영감을 받았습니다. 일렬로 연결된 아미노산들이 접히면서 복잡한 공간 구조를 형성한다는 점이 흥미로웠습니다. 그렇다면 가상 데스크톱도 꼭 일렬로 배치해야 할까요? 우리가 작업을 구분하고 연결하는 방식에 따라 공간적으로 배치할 수는 없을까요?" data-en="The idea for Flick was partly inspired by protein folding — how a linear chain of amino acids can fold into a complex spatial structure. It made me wonder: why should virtual desktops be confined to a single line? What if we could arrange them in a space that better reflects how we organize our work?">Flick의 아이디어는 단백질 접힘 현상에서 일부 영감을 받았습니다. 일렬로 연결된 아미노산들이 접히면서 복잡한 공간 구조를 형성한다는 점이 흥미로웠습니다. 그렇다면 가상 데스크톱도 꼭 일렬로 배치해야 할까요? 우리가 작업을 구분하고 연결하는 방식에 따라 공간적으로 배치할 수는 없을까요?</span></p>
</div>

<script>
(() => {
'use strict';
const qs = new URLSearchParams(location.search);
const FREEZE = qs.has('t') ? parseFloat(qs.get('t')) : null;   // ?t=3.6 holds one frame of the loop
// The loop is the page's content, like an embedded video, so it plays even
// where the system asks for reduced motion (Windows reports that whenever
// its animation effects are off, which left desktop visitors a still image).
const STILL = FREEZE !== null;

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const inOut = t => (t = clamp(t, 0, 1), t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const follow = (cur, to, dt, tau) => to + (cur - to) * Math.exp(-dt / tau);
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
const white = a => `rgba(255,255,255,${a})`;
const black = a => `rgba(0,0,0,${a})`;

/* ---------- language ---------- */
let lang = 'ko';
try { lang = localStorage.getItem('flick-lang') || ''; } catch (e) { lang = ''; }
if (qs.get('lang')) lang = qs.get('lang');
if (lang !== 'ko' && lang !== 'en') lang = (navigator.languages || [navigator.language || 'ko']).some(l => /^ko/i.test(l)) ? 'ko' : 'en';
const tr = v => (v && typeof v === 'object') ? v[lang] : v;
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-ko]').forEach(el => { el.textContent = el.dataset[lang]; });
  document.querySelectorAll('[data-ko-label]').forEach(el => { el.setAttribute('aria-label', el.dataset[lang + 'Label']); });
}

/* ---------- drawing helpers ---------- */
let FONT = 'system-ui,sans-serif';
function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function bar(g, x, y, w, h, c, r) { g.fillStyle = c; if (r) { rr(g, x, y, w, h, r); g.fill(); } else g.fillRect(x, y, w, h); }
function ring(g, x, y, w, h, c, lw, r) { g.strokeStyle = c; g.lineWidth = lw; rr(g, x, y, w, h, r || 0); g.stroke(); }
function dot(g, x, y, r, c) { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
function line(g, x0, y0, x1, y1, c, lw) { g.strokeStyle = c; g.lineWidth = lw; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
function txt(g, s, x, y, px, c, weight, align) {
  g.font = `${weight || 400} ${px}px ${FONT}`; g.fillStyle = c; g.textAlign = align || 'left'; g.textBaseline = 'middle'; g.fillText(s, x, y);
}
/* A repeatable scatter, so a wallpaper looks the same every time it is painted. */
function seeded(seed) { let s = 0; for (const ch of String(seed)) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
/* Blurs what is already on the canvas behind a shape, for glass panels. */
function frost(g, hero, blur) {
  g.save(); g.clip(); g.filter = `blur(${blur}px)`;
  g.drawImage(hero.cv, 0, 0, hero.cv.width, hero.cv.height, 0, 0, hero.W, hero.H);
  g.restore();
}

/* Soft blocks inside a window, as fractions of its content box: x, y, w, h, strength. */
const BLOCKS = {
  side: [[0, 0, .22, 1, .28], [.25, 0, .75, .58, .9], [.25, .63, .36, .37, .28], [.64, .63, .36, .37, .28]],
  hero: [[0, 0, 1, .5, .9], [0, .56, .31, .44, .28], [.345, .56, .31, .44, .28], [.69, .56, .31, .44, .28]],
  list: [[0, 0, 1, .29, .9], [0, .355, 1, .29, .28], [0, .71, 1, .29, .28]],
  cols: [[0, 0, .48, 1, .9], [.52, 0, .48, .47, .28], [.52, .53, .48, .47, .28]],
  one:  [[0, 0, 1, .62, .9], [0, .69, .6, .31, .28]],
};
/* The switcher's geometry, shared by every look: one cell per desktop, rows shifted onto one column. */
function miniGeom(grid, cx, cy, s, o) {
  o = o || {};
  const CW = (o.cw || 46) * s, CH = (o.ch || 30) * s, GAP = (o.gap || 7) * s, PAD = (o.pad || 20) * s, TITLE = (o.title ?? 26) * s, rows = grid.m.rows;
  const pw = PAD * 2 + grid.colsE * (CW + GAP) - GAP, ph = PAD * 2 + rows.length * (CH + GAP) - GAP + TITLE;
  const x0 = cx - pw / 2, y0 = cy - ph / 2;
  return { CW, CH, GAP, PAD, TITLE, pw, ph, x0, y0, rows, X: c => x0 + PAD + c * (CW + GAP), Y: r => y0 + PAD + r * (CH + GAP) };
}

/* ---------- Draft A — Aqua: a light macOS desktop, pastel wallpaper, menu bar and dock, glass switcher ---------- */
const LIGHTS = ['#ff5f57', '#febc2e', '#28c840'];
const T = {
  accent: '#0a84ff', top: 20, bottom: 54, round: 1,
  font: '"Inter","IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif',
  fontFaces: [[500, '"Inter"'], [600, '"Inter"'], [500, '"IBM Plex Sans KR"'], [600, '"IBM Plex Sans KR"']],
  tints: {   // wallpaper from, wallpaper to, the colour inside its windows
    teal:   ['#d6f2ee', '#8fd3cb', '#1f9e93'],
    amber:  ['#dceaff', '#9fc0f4', '#3d7be0'],
    violet: ['#e9defc', '#a99ce9', '#7a5ae3'],
    rose:   ['#fde0e8', '#eea4bf', '#dc4a7f'],
    green:  ['#dff4e2', '#9cd5b4', '#2ea067'],
    slate:  ['#e6ebf3', '#aab8d0', '#5b7096'],
  },
  /* Sonoma-like: a light wash crossed by two slow waves. */
  wall(g, w, h, t) {
    let gr = g.createLinearGradient(0, 0, w, h); gr.addColorStop(0, t[0]); gr.addColorStop(1, t[1]); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    gr = g.createRadialGradient(w * .18, h * .1, 0, w * .18, h * .1, Math.max(w, h) * .7); gr.addColorStop(0, white(.7)); gr.addColorStop(1, white(0)); g.fillStyle = gr; g.fillRect(0, 0, w, h);
    const wave = (y0, y1, c) => { g.fillStyle = c; g.beginPath(); g.moveTo(0, h * y0); g.bezierCurveTo(w * .35, h * (y0 - .2), w * .6, h * (y1 + .22), w, h * y1); g.lineTo(w, h); g.lineTo(0, h); g.closePath(); g.fill(); };
    wave(.6, .42, white(.26)); wave(.82, .66, rgba(t[2], .16));
  },
  window(g, win, w, h, u, t) {
    const top = 28 * u, p = 14 * u;
    g.save(); rr(g, 0, 0, w, h, 11 * u); g.clip();
    bar(g, 0, 0, w, h, '#ffffff');
    if (win.kind === 'side') { bar(g, 0, 0, w * .26, h, rgba(t[0], .9)); line(g, w * .26, 0, w * .26, h, black(.08), 1); }
    LIGHTS.forEach((c, i) => dot(g, (14 + i * 15) * u, top / 2, 4.6 * u, c));
    txt(g, tr(win.label), w / 2, top / 2 + .5 * u, 11 * u, '#3a3a40', 600, 'center');
    const ox = win.kind === 'side' ? w * .26 : 0, cw = w - ox - 2 * p, ch = h - top - p;
    BLOCKS[win.kind].forEach((b, i) => {
      if (win.kind === 'side' && i === 0) { for (let k = 0; k < 5; k++) bar(g, p, top + 12 * u + k * 16 * u, w * .26 - 2 * p - (k % 2) * 10 * u, 6 * u, black(k ? .12 : .22), 3 * u); return; }
      const bx = win.kind === 'side' ? ox + p + (b[0] - .25) / .75 * cw : p + b[0] * cw, bw = win.kind === 'side' ? b[2] / .75 * cw : b[2] * cw;
      g.globalAlpha = b[4] > .5 ? 1 : .5;
      const gr = g.createLinearGradient(0, top + b[1] * ch, 0, top + (b[1] + b[3]) * ch); gr.addColorStop(0, rgba(t[2], b[4] > .5 ? .85 : .35)); gr.addColorStop(1, rgba(t[2], b[4] > .5 ? .6 : .2));
      bar(g, bx, top + b[1] * ch, bw, b[3] * ch - p * .3, gr, 8 * u);
    });
    g.globalAlpha = 1; g.restore();
    ring(g, .5, .5, w - 1, h - 1, black(.14), 1, 11 * u);
  },
  shadow(g, u, dpr) { g.shadowColor = 'rgba(40,52,100,.26)'; g.shadowBlur = 36 * u * dpr; g.shadowOffsetY = 14 * u * dpr; },
  /* Menu bar on top, a floating dock below. */
  chrome(g, hero) {
    const { W, H, u } = hero, mb = 20 * u;
    bar(g, 0, 0, W, mb, white(.5)); line(g, 0, mb, W, mb, black(.06), 1);

    g.save(); g.shadowColor = M.glow || 'rgba(0,0,0,.4)'; g.shadowBlur = 10 * u * this.dpr; g.shadowOffsetY = (M.glow ? 0 : 3) * u * this.dpr; bar(g, x, y, w, h, M.body, 17 * u * (M.round ?? 1)); g.restore();

    }
    if (this.board.a > .005) { this.drawBoard(); this.drawCursor(); }
    this.drawMouse();
  }
}

/* ---------- wiring ---------- */
applyLang();
const hero = new Hero(document.getElementById('hero'));
const words = [...document.querySelectorAll('#line span')];
let beatTimer = 0;
hero.onBeat = i => { words.forEach((w, j) => w.classList.toggle('on', j === i)); if (T.onBeat) T.onBeat(i); clearTimeout(beatTimer); beatTimer = setTimeout(() => { words.forEach(w => w.classList.remove('on')); if (T.onBeat) T.onBeat(-1); }, 650); };

function redrawStill() { hero.seek(FREEZE); hero.draw(); }
/* Text on the canvases changes with the language and once the web font arrives. */
function repaint() { hero.sprites.clear(); if (STILL) redrawStill(); }

document.getElementById('lang').addEventListener('click', () => { lang = lang === 'ko' ? 'en' : 'ko'; try { localStorage.setItem('flick-lang', lang); } catch (e) {} applyLang(); repaint(); });
if (document.fonts) {
  const all = '워크스페이스편집기브라우저메모디자인채팅WorkspaceEditorBrowserNotesDesignChat123';
  Promise.all(T.fontFaces.map(([w, f]) => document.fonts.load(`${w} 12px ${f}`, all))).then(repaint, () => {});
}
new ResizeObserver(() => { hero.resize(); if (STILL) redrawStill(); else hero.draw(); }).observe(hero.cv);

/* Plays by itself, and only while it is on screen. */
if ('IntersectionObserver' in window) { hero.visible = false; new IntersectionObserver(es => { hero.visible = es[es.length - 1].isIntersecting; kick(); }, { threshold: .05 }).observe(hero.cv); }

let raf = 0, last = 0;
function frame(now) {
  raf = 0;
  const dt = Math.min(.05, (now - last) / 1000 || 0); last = now;
  if (!hero.visible || document.hidden) return;
  hero.step(dt); hero.draw(); raf = requestAnimationFrame(frame);
}
function kick() { if (STILL || raf || document.hidden || !hero.visible) return; last = performance.now(); raf = requestAnimationFrame(frame); }
document.addEventListener('visibilitychange', kick);
if (STILL) redrawStill(); else kick();
})();
