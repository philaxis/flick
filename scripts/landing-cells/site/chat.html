<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>팀 대화</title>
<style>
body{margin:0;height:100vh;display:flex;flex-direction:column;background:#1b1d22;color:#e3e5e8;font:13px/1.45 "Segoe UI","Malgun Gothic",sans-serif;overflow:hidden}
.top{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid #262930}
.tab{padding:4px 10px;border-radius:6px;color:#a3a7b0}.tab.on{background:#2b2f37;color:#fff;font-weight:600}.tab i{font-style:normal;background:#579eff;color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:4px}
.msgs{flex:1;padding:4px 14px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.m{display:grid;grid-template-columns:30px 1fr;gap:9px;margin:9px 0}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;font-size:12px}
.n{font-weight:600}.n small{color:#80848e;font-weight:400;margin-left:6px}
.code{background:#111317;border:1px solid #262930;border-radius:6px;padding:5px 8px;font-family:Consolas,monospace;font-size:12px;margin-top:3px}
.box{margin:0 14px 12px;background:#2b2f37;border-radius:8px;padding:9px 12px;color:#80848e}
</style></head><body>
<div class="top"><span class="tab on"># flick</span><span class="tab"># 보고서 <i>2</i></span><span class="tab"># 일반</span></div>
<div class="msgs">
<div class="m"><div class="av" style="background:#3b82f6">민</div><div><div class="n">민호<small>오전 9:42</small></div>세로 이동이 휠처럼 한 칸씩 걸리는 거 좋네요.</div></div>
<div class="m"><div class="av" style="background:#10b981">지</div><div><div class="n">지수<small>오전 9:58</small></div>테스트 다 통과했어요.<div class="code">test result: ok. 128 passed</div></div></div>
<div class="m"><div class="av" style="background:#f59e0b">서</div><div><div class="n">서연<small>오전 10:05</small></div>보고서 초안 v3 올렸어요. 그림 1 확인 부탁해요 🙏</div></div>
<div class="m"><div class="av" style="background:#3b82f6">민</div><div><div class="n">민호<small>오전 10:07</small></div>점심 먹고 볼게요!</div></div>
</div><div class="box">메시지 보내기</div></body></html>
