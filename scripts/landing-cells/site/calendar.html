<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>일정 — 이번 주</title>
<style>
body{margin:0;background:#17181b;color:#e4e4e7;font:13px/1.4 "Segoe UI","Malgun Gothic",sans-serif}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid #27272a}
header b{font-size:18px}.btn{border:1px solid #3f3f46;border-radius:6px;padding:4px 12px;color:#a1a1aa}
.grid{display:grid;grid-template-columns:52px repeat(5,1fr);position:relative}
.h{padding:10px;border-bottom:1px solid #27272a;color:#a1a1aa;text-align:center;font-weight:600}
.t{height:56px;border-bottom:1px solid #222225;border-right:1px solid #222225;color:#71717a;font-size:11px;padding:2px 6px;text-align:right}
.c{height:56px;border-bottom:1px solid #222225;border-right:1px solid #222225}
.e{position:absolute;border-radius:6px;padding:6px 8px;font-weight:600;color:#fff;overflow:hidden}
.e small{display:block;font-weight:400;opacity:.85}
</style></head><body>
<header><b>이번 주</b><span class="btn">오늘</span><span class="btn">‹</span><span class="btn">›</span><span style="margin-left:auto" class="btn">주</span></header>
<div class="grid" id="g"></div>
<script>
const g=document.getElementById('g');g.innerHTML='<div class="h"></div>'+['월','화','수','목','금'].map(d=>`<div class="h">${d}</div>`).join('');
for(let h=9;h<18;h++){g.innerHTML+=`<div class="t">${h}:00</div>`+'<div class="c"></div>'.repeat(5)}
const ev=[[1,10,1,'#2563eb','주간 회의','회의실 B'],[0,13,1.5,'#059669','도시 숲 현장 사진 고르기','서연'],[3,14,2,'#7c3aed','tidepool 0.5 릴리스','점검 후 배포'],[2,9.5,1,'#2563eb','문서 첫 화면 검토','지수'],[4,11,1,'#dc2626','보고서 의견 마감','초안 v3'],[1,15,1,'#059669','기온 그림 다시 그리기',''],[4,16,1.5,'#d97706','회고',''],[2,12,1,'#3f3f46','점심','']];
const W=(g.clientWidth-52)/5;
ev.forEach(([d,h,len,c,n,s])=>{const e=document.createElement('div');e.className='e';e.style.cssText=`left:${52+d*W+4}px;width:${W-8}px;top:${38+(h-9)*56+2}px;height:${len*56-4}px;background:${c}`;e.innerHTML=`${n}<small>${s}</small>`;g.appendChild(e)});
</script></body></html>
