<h1>가로수 그늘은 얼마나 시원할까</h1><div class="by">도시환경 노트 편집부 · 읽는 데 6분</div>
<p>한여름 오후 두 시, 같은 거리라도 나무 그늘이 이어지는 보도와 볕이 그대로 드는 보도의 온도는 다르다. 서른 곳의 보도를 일주일 동안 잰 결과, <mark>그늘이 절반 넘게 드는 보도는 평균 2~3 ℃ 낮았다.</mark></p>
<figure><div></div><figcaption>그림 1. 가로수가 이어진 보도와 그렇지 않은 보도</figcaption></figure>
<p>차이는 기온보다 표면 온도에서 더 컸다. 햇볕을 그대로 받은 보도블록은 50 ℃를 넘기기도 했지만, 그늘 아래 블록은 30 ℃ 안팎에 머물렀다.</p>
