<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Team chat</title>
<style>
body{margin:0;height:100vh;display:flex;flex-direction:column;background:#1b1d22;color:#e3e5e8;font:13px/1.45 "Segoe UI",sans-serif;overflow:hidden}
.top{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid #262930}
.tab{padding:4px 10px;border-radius:6px;color:#a3a7b0}.tab.on{background:#2b2f37;color:#fff;font-weight:600}.tab i{font-style:normal;background:#579eff;color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:4px}
.msgs{flex:1;padding:4px 14px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.m{display:grid;grid-template-columns:30px 1fr;gap:9px;margin:9px 0}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;font-size:12px}
.n{font-weight:600}.n small{color:#80848e;font-weight:400;margin-left:6px}
.code{background:#111317;border:1px solid #262930;border-radius:6px;padding:5px 8px;font-family:Consolas,monospace;font-size:12px;margin-top:3px}
.box{margin:0 14px 12px;background:#2b2f37;border-radius:8px;padding:9px 12px;color:#80848e}
</style></head><body>
<div class="top"><span class="tab on"># flick</span><span class="tab"># reports <i>2</i></span><span class="tab"># general</span></div>
<div class="msgs">
<div class="m"><div class="av" style="background:#3b82f6">A</div><div><div class="n">Alex<small>9:42 AM</small></div>Love how up and down now steps one row at a time, like a wheel.</div></div>
<div class="m"><div class="av" style="background:#10b981">J</div><div><div class="n">Jamie<small>9:58 AM</small></div>All tests pass.<div class="code">test result: ok. 128 passed</div></div></div>
<div class="m"><div class="av" style="background:#f59e0b">S</div><div><div class="n">Sam<small>10:05 AM</small></div>Report draft v3 is up. Could you check figure 1? 🙏</div></div>
<div class="m"><div class="av" style="background:#3b82f6">A</div><div><div class="n">Alex<small>10:07 AM</small></div>Will look after lunch!</div></div>
</div><div class="box">Message #flick</div></body></html>
